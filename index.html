<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Start</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Video (cover: riempie lo schermo, ritagliato) ---------- */
  #player {
    position: fixed;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    border: 0;
    pointer-events: none;
    z-index: 1;
    transform-origin: center center;
    will-change: transform;
  }

  /* ---------- Ricerca (in basso al centro) ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    padding: 24px 24px calc(28px + env(safe-area-inset-bottom));
    pointer-events: none;
  }

  .search-wrap {
    position: relative;
    width: min(620px, calc(100vw - 48px));
    pointer-events: auto;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 22px;
    border-radius: 999px;
    background: rgba(8,8,10,.62);
    border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 14px 44px rgba(0,0,0,.55);
    transition: background .2s, border-color .2s, box-shadow .2s;
  }

  .search-box:focus-within {
    background: rgba(8,8,10,.78);
    border-color: rgba(255,255,255,.45);
    box-shadow: 0 16px 52px rgba(0,0,0,.65);
  }

  .search-box svg { flex: 0 0 auto; width: 21px; height: 21px; opacity: .9; }

  #q {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #fff;
    font-size: 17px;
    padding: 14px 0;
  }

  #q::placeholder { color: rgba(255,255,255,.6); }

  .hint {
    font-size: 12.5px;
    letter-spacing: .4px;
    opacity: .55;
    padding-left: 4px;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }

  .hint kbd {
    font-family: inherit;
    font-size: 11px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 5px;
    padding: 1px 5px;
    margin: 0 2px;
  }

  /* ---------- Orologio (in alto al centro) ---------- */
  .topclock {
    position: fixed;
    top: 26px;
    left: 0;
    right: 0;
    z-index: 3;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 4px 26px rgba(0,0,0,.6);
  }

  .dayname {
    font-size: clamp(40px, 5.2vw, 72px);
    font-weight: 200;
    letter-spacing: 10px;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
  }

  .time {
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 3px;
    opacity: .8;
    margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Colonna destra ---------- */
  .side {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 4;
    width: min(850px, 45vw);
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    justify-content: flex-start;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
  }

  .side::-webkit-scrollbar { width: 8px; }
  .side::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }

  .card {
    background: rgba(6,6,9,.68);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 20px;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    padding: 18px 22px;
    flex: 1 1 auto;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }

  /* Meteo */
  .wx {
    display: flex;
    align-items: center;
    gap: 20px;
    flex: 1 1 auto;
  }

  .wx-icon {
    flex: 0 0 auto;
    width: 74px;
    height: 74px;
    display: grid;
    place-items: center;
  }

  .wx-icon svg { width: 64px; height: 64px; }

  .wx-main { flex: 1 1 auto; min-width: 0; }

  .wx-title {
    font-size: 14px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    opacity: .65;
  }

  .wx-desc {
    font-size: 21px;
    font-weight: 600;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .wx-temp {
    flex: 0 0 auto;
    font-size: 56px;
    font-weight: 200;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
  }

  .wx-sub {
    font-size: 14.5px;
    opacity: .6;
    margin-top: 4px;
  }

  .wx-place {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    opacity: .7;
    margin-bottom: 14px;
  }

  .wx-place b { font-weight: 700; opacity: 1; cursor: pointer; text-transform: none; letter-spacing: .2px; }
  .wx-place b:hover { text-decoration: underline; }

  /* Calendario */
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    opacity: .8;
    margin-bottom: 14px;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
    flex: 1 1 auto;
    align-content: start;
  }

  .cal-grid .dow {
    font-size: 12px;
    opacity: .5;
    padding-bottom: 6px;
    text-transform: uppercase;
  }

  .cal-grid .day {
    font-size: 16px;
    padding: 8px 0;
    border-radius: 10px;
    opacity: .85;
    font-variant-numeric: tabular-nums;
  }

  .cal-grid .day.empty { opacity: 0; }
  .cal-grid .day.today {
    background: #fff;
    color: #111;
    font-weight: 700;
    opacity: 1;
  }

  /* Notepad */
  .note-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    opacity: .7;
    margin-bottom: 10px;
  }

  #notes {
    width: 100%;
    flex: 1 1 auto;
    min-height: 90px;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    line-height: 1.5;
  }

  #notes::placeholder { color: rgba(255,255,255,.35); }

  /* ---------- Toast audio ---------- */
  #toast {
    position: fixed;
    left: 24px;
    top: 24px;
    z-index: 7;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13px;
    background: rgba(6,6,9,.72);
    border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(14px);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
  }

  #toast.show { opacity: 1; transform: translateY(0); }
  #toast svg { width: 17px; height: 17px; }

  /* ---------- Overlay "click to play" ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(0,0,0,.55);
    cursor: pointer;
  }

  #overlay.show { display: flex; }

  #overlay .play {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    display: grid;
    place-items: center;
  }

  #overlay .play svg { width: 34px; height: 34px; margin-left: 4px; }
  #overlay p { font-size: 15px; opacity: .85; }

  /* ---------- Phone: search only ---------- */
  @media (max-width: 900px), (max-height: 560px) {
    .side { display: none; }
    .topclock { display: none; }
    .search-wrap { width: 100%; }
  }

  @media (max-width: 520px) {
    .search-box { padding: 4px 18px; }
    #q { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="player"></div>

<div class="topclock">
  <div class="dayname" id="dayName"></div>
  <div class="time" id="time"></div>
</div>

<div class="stage">
  <form class="search-wrap" id="form" autocomplete="off">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="q" type="text" placeholder="Search on Google..." autofocus spellcheck="false">
    </div>
  </form>
  <div class="hint"><kbd>/</kbd> to search &nbsp;·&nbsp; <kbd>Esc</kbd> to exit &nbsp;·&nbsp; click the background for audio</div>
</div>

<aside class="side">
  <div class="card">
    <div class="wx-place">
      <span>Weather</span>
      <b id="wxCity" title="Click to change the city">&nbsp;</b>
    </div>
    <div class="wx">
      <div class="wx-icon" id="wxIconNow"></div>
      <div class="wx-main">
        <div class="wx-title">Today</div>
        <div class="wx-desc" id="wxDescNow">—</div>
        <div class="wx-sub" id="wxSubNow"></div>
      </div>
      <div class="wx-temp" id="wxTempNow">--°</div>
    </div>
  </div>

  <div class="card">
    <div class="wx">
      <div class="wx-icon" id="wxIcon12"></div>
      <div class="wx-main">
        <div class="wx-title">In 12 hours</div>
        <div class="wx-desc" id="wxDesc12">—</div>
        <div class="wx-sub" id="wxSub12"></div>
      </div>
      <div class="wx-temp" id="wxTemp12">--°</div>
    </div>
  </div>

  <div class="card">
    <div class="cal-head"><span id="calTitle"></span><span id="calToday"></span></div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="card">
    <div class="note-head"><span>Notes</span><span id="noteState"></span></div>
    <textarea id="notes" placeholder="Write here..." spellcheck="false"></textarea>
  </div>
</aside>

<div id="toast"><span id="toastIcon"></span><span id="toastText"></span></div>

<div id="overlay">
  <div class="play">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
  </div>
  <p>Click to play the video</p>
</div>

<script>
  var VIDEO_ID = "rFZHOHl-L8A";
  var SEARCH_URL = "https://www.google.com/search?q=";
  var BASE_W = 1920;
  var BASE_H = 1080;
  var OVERSCAN = 1.04;

  var player = null;
  var muted = true;
  var overlay = document.getElementById("overlay");

  /* ================= YouTube player ================= */
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      videoId: VIDEO_ID,
      host: "https://www.youtube-nocookie.com",
      width: BASE_W,
      height: BASE_H,
      playerVars: {
        autoplay: 1, loop: 1, playlist: VIDEO_ID, controls: 0, disablekb: 1,
        modestbranding: 1, playsinline: 1, fs: 0, iv_load_policy: 3,
        cc_load_policy: 0, rel: 0
      },
      events: {
        onReady: function (e) {
          e.target.mute();
          e.target.playVideo();
          fitPlayer();
          overlay.classList.remove("show");
        },
        onError: function () { overlay.classList.add("show"); },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) overlay.classList.remove("show");
        }
      }
    });
  }

  function fitPlayer() {
    var el = document.getElementById("player");
    if (!el) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var k = Math.max(vw / BASE_W, vh / BASE_H) * OVERSCAN;
    el.style.width = BASE_W + "px";
    el.style.height = BASE_H + "px";
    el.style.left = Math.round((vw - BASE_W) / 2) + "px";
    el.style.top = Math.round((vh - BASE_H) / 2) + "px";
    el.style.transform = "scale(" + k + ")";
  }

  fitPlayer();
  window.addEventListener("resize", fitPlayer);
  window.addEventListener("orientationchange", function () { setTimeout(fitPlayer, 300); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fitPlayer);

  overlay.addEventListener("click", function () {
    if (player && player.playVideo) { player.mute(); player.playVideo(); }
    overlay.classList.remove("show");
  });

  /* ================= Audio on background click ================= */
  var ICON_MUTED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M22 9l-6 6M16 9l6 6"></path></svg>';
  var ICON_SOUND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M16.5 8.5a5 5 0 010 7"></path><path d="M19.5 5.5a9 9 0 010 13"></path></svg>';

  var toast = document.getElementById("toast");
  var toastTimer = null;

  function showToast(text, icon) {
    document.getElementById("toastText").textContent = text;
    document.getElementById("toastIcon").innerHTML = icon;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1600);
  }

  function toggleAudio() {
    muted = !muted;
    if (player && player.mute && player.unMute) {
      muted ? player.mute() : player.unMute();
    }
    showToast(muted ? "Audio off" : "Audio on", muted ? ICON_MUTED : ICON_SOUND);
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest("input, textarea, button, select, a, .side, #overlay")) return;
    toggleAudio();
  });

  /* ================= Clock ================= */
  var DOW_EN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS_EN = ["January", "February", "March", "April", "May", "June", "July",
                   "August", "September", "October", "November", "December"];

  function tick() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    document.getElementById("dayName").textContent = DOW_EN[d.getDay()];
    document.getElementById("time").textContent =
      (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  }
  tick();
  setInterval(tick, 1000);

  /* ================= Weather (Open-Meteo) ================= */
  var WMO = {
    0:  ["Clear sky", "sun"],
    1:  ["Mainly clear", "partly"],
    2:  ["Partly cloudy", "partly"],
    3:  ["Overcast", "cloud"],
    45: ["Fog", "fog"],
    48: ["Freezing fog", "fog"],
    51: ["Light drizzle", "rain"],
    53: ["Drizzle", "rain"],
    55: ["Heavy drizzle", "rain"],
    56: ["Freezing drizzle", "rain"],
    57: ["Heavy freezing drizzle", "rain"],
    61: ["Light rain", "rain"],
    63: ["Rain", "rain"],
    65: ["Heavy rain", "rain"],
    66: ["Freezing rain", "rain"],
    67: ["Heavy freezing rain", "rain"],
    71: ["Light snow", "snow"],
    73: ["Snow", "snow"],
    75: ["Heavy snow", "snow"],
    77: ["Snow grains", "snow"],
    80: ["Light showers", "rain"],
    81: ["Showers", "rain"],
    82: ["Violent showers", "rain"],
    85: ["Snow showers", "snow"],
    86: ["Heavy snow showers", "snow"],
    95: ["Thunderstorm", "storm"],
    96: ["Thunderstorm with hail", "storm"],
    99: ["Severe thunderstorm with hail", "storm"]
  };

  var ICONS = {
    sun:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>',
    partly: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"></circle><path d="M8 1.8v1.6M1.8 8h1.6M3.6 3.6l1.1 1.1M12.4 3.6l-1.1 1.1"></path><path d="M9.5 19.5h8a3.6 3.6 0 00.3-7.2A5 5 0 007.2 13 3.3 3.3 0 009.5 19.5z"></path></svg>',
    cloud:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 19h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 11.4 4 4 0 007.5 19z"></path></svg>',
    fog:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7.5 14h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 6.4 4 4 0 007.5 14z"></path><path d="M4 17h16M6 20.5h12"></path></svg>',
    rain:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 7.4 4 4 0 007.5 15z"></path><path d="M8.5 18l-1 3M13 18l-1 3M17.5 18l-1 3"></path></svg>',
    snow:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 7.4 4 4 0 007.5 15z"></path><path d="M8 18v3M6.6 18.8l2.8 1.4M9.4 18.8l-2.8 1.4M16 18v3M14.6 18.8l2.8 1.4M17.4 18.8l-2.8 1.4"></path></svg>',
    storm:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 7.4 4 4 0 007.5 15z"></path><path d="M13 16l-3 4h4l-2 3.5"></path></svg>'
  };

  function wxInfo(code) {
    var e = WMO[code] || ["Unknown", "cloud"];
    return { desc: e[0], icon: ICONS[e[1]] || ICONS.cloud };
  }

  function geocode(name) {
    return fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(name) +
                 "&count=1&language=en&format=json")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var r = (j.results || [])[0];
        if (!r) throw new Error("City not found");
        return { name: r.name, lat: r.latitude, lon: r.longitude };
      });
  }

  function defaultCity() {
    return geocode("Rome");
  }

  function locate() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem("sp_city")); } catch (e) {}
    if (saved) return Promise.resolve(saved);
    return new Promise(function (resolve) {
      if (!navigator.geolocation) { defaultCity().then(resolve).catch(function () { resolve(null); }); return; }
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          resolve({ name: "Current location", lat: pos.coords.latitude, lon: pos.coords.longitude });
        },
        function () { defaultCity().then(resolve).catch(function () { resolve(null); }); },
        { timeout: 7000, maximumAge: 1800000, enableHighAccuracy: false }
      );
    });
  }

  function loadWeather() {
    locate().then(function (city) {
      if (!city) return;
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + city.lat + "&longitude=" + city.lon +
        "&current=temperature_2m,apparent_temperature,weather_code" +
        "&hourly=temperature_2m,weather_code,precipitation_probability" +
        "&daily=temperature_2m_max,temperature_2m_min,weather_code" +
        "&timezone=auto&forecast_days=3";
      return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
        renderWeather(city, j);
      });
    }).catch(function () {
      document.getElementById("wxDescNow").textContent = "Weather unavailable";
    });
  }

  function renderWeather(city, j) {
    document.getElementById("wxCity").textContent = city.name;
    try { localStorage.setItem("sp_city", JSON.stringify(city)); } catch (e) {}

    var cur = j.current || {};
    var now = wxInfo(cur.weather_code);
    document.getElementById("wxIconNow").innerHTML = now.icon;
    document.getElementById("wxDescNow").textContent = now.desc;
    document.getElementById("wxTempNow").textContent = Math.round(cur.temperature_2m) + "°";
    var d0 = j.daily || {};
    var sub = "";
    if (d0.temperature_2m_max && d0.temperature_2m_min) {
      sub += "min " + Math.round(d0.temperature_2m_min[0]) + "° · max " + Math.round(d0.temperature_2m_max[0]) + "°";
    }
    if (cur.apparent_temperature != null) sub += (sub ? " · " : "") + "feels like " + Math.round(cur.apparent_temperature) + "°";
    document.getElementById("wxSubNow").textContent = sub;

    /* In 12 hours (local time of the place) */
    var h = j.hourly || {};
    if (h.time && h.time.length) {
      var ref = cur.time || h.time[0];
      var target = new Date(ref + "T00:00").getTime() + 12 * 3600 * 1000;
      var idx = 0, best = Infinity;
      for (var i = 0; i < h.time.length; i++) {
        var t = new Date(h.time[i] + "T00:00").getTime();
        var diff = Math.abs(t - target);
        if (diff < best) { best = diff; idx = i; }
      }
      var f = wxInfo(h.weather_code[idx]);
      document.getElementById("wxIcon12").innerHTML = f.icon;
      document.getElementById("wxDesc12").textContent = f.desc;
      document.getElementById("wxTemp12").textContent = Math.round(h.temperature_2m[idx]) + "°";
      var s12 = "at " + h.time[idx].slice(11, 16);
      if (h.precipitation_probability) s12 += " · " + h.precipitation_probability[idx] + "% rain";
      document.getElementById("wxSub12").textContent = s12;
    }
  }

  document.getElementById("wxCity").addEventListener("click", function () {
    var name = prompt("City for the weather:", this.textContent.trim());
    if (!name) return;
    geocode(name).then(function (c) {
      localStorage.setItem("sp_city", JSON.stringify(c));
      loadWeather();
    }).catch(function (err) { alert(err.message || "City not found"); });
  });

  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);

  /* ================= Calendar ================= */
  function renderCalendar() {
    var d = new Date();
    var y = d.getFullYear(), mo = d.getMonth();
    document.getElementById("calTitle").textContent = MONTHS_EN[mo] + " " + y;
    document.getElementById("calToday").textContent = d.getDate() + "-" + (mo + 1);

    var first = new Date(y, mo, 1);
    var days = new Date(y, mo + 1, 0).getDate();
    var offset = (first.getDay() + 6) % 7; /* week starts on Monday */

    var heads = [["M", "Mon"], ["T", "Tue"], ["W", "Wed"], ["T", "Thu"], ["F", "Fri"], ["S", "Sat"], ["S", "Sun"]];
    var html = heads.map(function (x) {
      return '<div class="dow" title="' + x[1] + '">' + x[0] + "</div>";
    }).join("");

    for (var i = 0; i < offset; i++) html += '<div class="day empty"></div>';
    for (var k = 1; k <= days; k++) {
      html += '<div class="day' + (k === d.getDate() ? " today" : "") + '">' + k + "</div>";
    }
    document.getElementById("calGrid").innerHTML = html;
  }
  renderCalendar();

  /* ================= Notepad ================= */
  var notes = document.getElementById("notes");
  var noteState = document.getElementById("noteState");
  var noteTimer = null;

  notes.value = localStorage.getItem("sp_notes") || "";

  notes.addEventListener("input", function () {
    noteState.textContent = "Saving...";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () {
      localStorage.setItem("sp_notes", notes.value);
      noteState.textContent = "Saved";
      setTimeout(function () { noteState.textContent = ""; }, 1200);
    }, 400);
  });
</script>
</body>
</html>
