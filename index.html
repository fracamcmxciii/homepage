<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WELCOME BACK FRACA!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0d0d0d;
            --border-color: #262626;
            --border-hover: #ffffff;
            --text-color: #ffffff;
            --text-dim: #737373;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Blocco zoom e scorrimento orizzontale */
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            touch-action: pan-y;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem 1rem;
            min-height: 100vh;
            position: relative;
        }

        /* Grid Monocromatico Cyberpunk */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
            animation: gridScan 12s linear infinite;
        }

        @keyframes gridScan {
            0% { background-position: 0 0; }
            100% { background-position: 0 30px; }
        }

        /* Scanline Overlay CRT */
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 99;
            opacity: 0.6;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 2.5rem auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Top Bar: Titolo a Sinistra + Meteo a Destra */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 0.5rem;
        }

        /* Titolo Glitch Cyberpunk */
        header h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.5rem;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: glitch 4s infinite;
            text-align: left;
            line-height: 1.1;
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
            92% { transform: translate(-2px, 1px); text-shadow: -2px 0 #ffffff, 2px 0 #555555; }
            94% { transform: translate(2px, -1px); text-shadow: 2px 0 #ffffff, -2px 0 #555555; }
            96% { transform: translate(-1px, -1px); text-shadow: 0 0 15px #ffffff; }
        }

        /* Widget Meteo Domani */
        .weather-widget {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.8rem;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            font-family: 'Share Tech Mono', monospace;
            flex-shrink: 0;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .weather-label {
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .weather-temp {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .weather-icon-container {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weather-icon-container svg {
            width: 100%;
            height: 100%;
            fill: #ffffff;
            stroke: #ffffff;
        }

        /* Search Bar Cyberpunk */
        .search-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-form {
            display: flex;
            gap: 0.5rem;
            background-color: var(--card-bg);
            padding: 0.4rem;
            border: 1px solid var(--border-color);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: all 0.3s ease;
        }

        .search-form:focus-within {
            border-color: var(--border-hover);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 0.6rem 1rem;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            letter-spacing: 1px;
            width: 100%;
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        .search-button {
            background: #ffffff;
            color: #000000;
            border: none;
            outline: none;
            padding: 0.6rem 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: all 0.2s ease;
        }

        .search-button:hover {
            background: #cccccc;
            box-shadow: 0 0 15px #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: relative;
            z-index: 1;
        }

        .category {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .category-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            color: #ffffff;
            text-transform: uppercase;
            border-left: 4px solid #ffffff;
            padding-left: 0.6rem;
            display: inline-block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 1rem;
        }

        .card {
            background-color: #000000;
            text-decoration: none;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            border: 1px solid var(--border-color);
            position: relative;
            aspect-ratio: 1 / 1;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            cursor: pointer;
        }

        .card:hover {
            background-color: #1a1a1a;
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .card img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            filter: grayscale(100%) brightness(200%);
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .card:hover img {
            filter: grayscale(0%) brightness(120%);
            transform: scale(1.1);
        }

        /* Pulsante Aggiungi Link (+) */
        .add-card-btn {
            border: 1px dashed var(--text-dim);
            background: transparent;
            color: var(--text-dim);
            font-size: 1.8rem;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .add-card-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Tooltip Cyberpunk */
        .card::after {
            content: attr(data-title);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            padding: 2px 6px;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
        }

        .card:hover::after {
            opacity: 1;
        }

        /* Pulsante Aggiungi Categoria */
        .add-category-container {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .add-category-btn {
            background-color: var(--card-bg);
            color: #ffffff;
            border: 1px dashed var(--border-color);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            padding: 1rem 2rem;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            width: 100%;
            max-width: 400px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.3s ease;
        }

        .add-category-btn:hover {
            border-color: #ffffff;
            background-color: #1a1a1a;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Modal Cyberpunk */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid #ffffff;
            padding: 2rem;
            width: 90%;
            max-width: 450px;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .modal h3 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.4rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 0.4rem;
        }

        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .modal-field label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .modal-field input {
            background: #000000;
            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 0.6rem 0.8rem;
            font-family: 'Share Tech Mono', monospace;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .modal-field input:focus {
            border-color: #ffffff;
        }

        .modal-buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }

        .modal-btn {
            font-family: 'Share Tech Mono', monospace;
            padding: 0.6rem 1.2rem;
            border: none;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }

        .modal-btn.confirm {
            background: #ffffff;
            color: #000000;
        }

        .modal-btn.confirm:hover {
            background: #cccccc;
        }

        .modal-btn.cancel {
            background: transparent;
            color: #ffffff;
            border: 1px solid var(--border-color);
        }

        .modal-btn.cancel:hover {
            border-color: #ffffff;
        }

        /* OTTIMIZZAZIONE SMARTPHONE / MOBILE */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.4rem;
                letter-spacing: 1px;
            }

            .weather-widget {
                padding: 0.3rem 0.5rem;
                gap: 0.4rem;
            }

            .weather-label {
                font-size: 0.5rem;
            }

            .weather-temp {
                font-size: 0.85rem;
            }

            .weather-icon-container {
                width: 24px;
                height: 24px;
            }

            .search-input {
                padding: 0.4rem 0.6rem;
                font-size: 0.85rem;
            }

            .search-button {
                padding: 0.4rem 0.7rem;
                font-size: 0.75rem;
            }

            .category {
                padding: 0.8rem;
            }

            .category-title {
                font-size: 1.1rem;
                margin-bottom: 0.6rem;
            }

            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 0.4rem;
            }

            .card {
                padding: 0.4rem;
            }

            .card img {
                width: 24px;
                height: 24px;
            }
            
            .add-category-btn {
                font-size: 0.9rem;
                padding: 0.8rem 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- CRT Scanline Effect -->
    <div class="scanline"></div>

    <header>
        <div class="top-bar">
            <h1>WELCOME BACK FRACA!</h1>
            
            <!-- Widget Meteo Domani -->
            <div class="weather-widget" id="weather-widget">
                <div class="weather-info">
                    <span class="weather-label">TOMORROW</span>
                    <span class="weather-temp" id="weather-temp">--°C</span>
                </div>
                <div class="weather-icon-container" id="weather-icon-box">
                    <!-- SVG Vettoriale generato da JS -->
                </div>
            </div>
        </div>
        
        <!-- Barra di Ricerca DuckDuckGo -->
        <div class="search-container">
            <form class="search-form" action="https://duckduckgo.com/" method="get" target="_blank">
                <input type="text" name="q" class="search-input" placeholder="SEARCH MATRIX..." autofocus required>
                <button type="submit" class="search-button">SEARCH</button>
            </form>
        </div>
    </header>

    <main class="container" id="main-container">
        
        <!-- SOCIAL -->
        <section class="category" id="cat-social">
            <h2 class="category-title">Social</h2>
            <div class="grid">
                <a href="https://www.youtube.com" target="_blank" class="card" data-title="YouTube">
                    <img src="https://cdn.simpleicons.org/youtube/ffffff" alt="YouTube" onerror="this.src='https://icons.duckduckgo.com/ip3/youtube.com.ico'">
                </a>
                <a href="https://www.reddit.com" target="_blank" class="card" data-title="Reddit">
                    <img src="https://cdn.simpleicons.org/reddit/ffffff" alt="Reddit" onerror="this.src='https://icons.duckduckgo.com/ip3/reddit.com.ico'">
                </a>
                <a href="https://www.pinterest.com" target="_blank" class="card" data-title="Pinterest">
                    <img src="https://cdn.simpleicons.org/pinterest/ffffff" alt="Pinterest" onerror="this.src='https://icons.duckduckgo.com/ip3/pinterest.com.ico'">
                </a>
                <a href="https://www.instagram.com" target="_blank" class="card" data-title="Instagram">
                    <img src="https://cdn.simpleicons.org/instagram/ffffff" alt="Instagram" onerror="this.src='https://icons.duckduckgo.com/ip3/instagram.com.ico'">
                </a>
                <a href="https://www.facebook.com" target="_blank" class="card" data-title="Facebook">
                    <img src="https://cdn.simpleicons.org/facebook/ffffff" alt="Facebook" onerror="this.src='https://icons.duckduckgo.com/ip3/facebook.com.ico'">
                </a>
                <a href="https://web.telegram.org" target="_blank" class="card" data-title="Telegram">
                    <img src="https://cdn.simpleicons.org/telegram/ffffff" alt="Telegram" onerror="this.src='https://icons.duckduckgo.com/ip3/telegram.org.ico'">
                </a>
                <button class="card add-card-btn" onclick="openAddLinkModal(this)" data-title="Aggiungi Link">+</button>
            </div>
        </section>

        <!-- MEDIA -->
        <section class="category" id="cat-media">
            <h2 class="category-title">Media</h2>
            <div class="grid">
                <a href="https://store.steampowered.com" target="_blank" class="card" data-title="Steam">
                    <img src="https://cdn.simpleicons.org/steam/ffffff" alt="Steam" onerror="this.src='https://icons.duckduckgo.com/ip3/store.steampowered.com.ico'">
                </a>
                <a href="https://store.epicgames.com" target="_blank" class="card" data-title="Epic Games">
                    <img src="https://cdn.simpleicons.org/epicgames/ffffff" alt="Epic Games" onerror="this.src='https://icons.duckduckgo.com/ip3/epicgames.com.ico'">
                </a>
                <a href="https://www.gog.com" target="_blank" class="card" data-title="GOG">
                    <img src="https://cdn.simpleicons.org/gogdotcom/ffffff" alt="GOG" onerror="this.src='https://icons.duckduckgo.com/ip3/gog.com.ico'">
                </a>
                <a href="https://fmhy.net" target="_blank" class="card" data-title="FMHY">
                    <img src="https://icon.horse/icon/fmhy.net" alt="FMHY" onerror="this.src='https://icons.duckduckgo.com/ip3/fmhy.net.ico'">
                </a>
                <a href="https://fitgirl-repacks.site" target="_blank" class="card" data-title="FitGirl Repacks">
