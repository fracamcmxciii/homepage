<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Start</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Video (cover: riempie lo schermo, ritagliato) ---------- */
  #player {
    position: fixed;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    border: 0;
    pointer-events: none;
    z-index: 1;
    transform-origin: center center;
    will-change: transform;
  }

  /* ---------- Cornice nera (davanti allo sfondo, dietro gli elementi) ---------- */
  #frame {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    border: clamp(28px, 3.6vw, 62px) solid #000;
    box-shadow: inset 0 0 clamp(34px, 4.4vw, 78px) clamp(12px, 1.6vw, 30px) #000;
  }

  /* ---------- Ricerca (in basso al centro) ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    padding: 24px 0 calc(28px + env(safe-area-inset-bottom));
    pointer-events: none;
  }

  .search-wrap {
    position: relative;
    width: min(500px, 26vw);
    pointer-events: auto;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 22px;
    border-radius: 999px;
    background: rgba(8,8,10,.62);
    border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 14px 44px rgba(0,0,0,.55);
    transition: background .2s, border-color .2s, box-shadow .2s;
  }

  .search-box:focus-within {
    background: rgba(8,8,10,.78);
    border-color: rgba(255,255,255,.45);
    box-shadow: 0 16px 52px rgba(0,0,0,.65);
  }

  .search-box svg { flex: 0 0 auto; width: 21px; height: 21px; opacity: .9; }

  #q {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #fff;
    font-size: 25.5px;
    padding: 14px 0;
  }

  #q::placeholder { color: rgba(255,255,255,.6); }

  .hint {
    width: min(500px, 26vw);
    font-size: 14px;
    letter-spacing: 0.3px;
    text-align: center;
    opacity: .55;
    padding-left: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }

  .hint kbd {
    font-family: inherit;
    font-size: 16.5px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 5px;
    padding: 1px 5px;
    margin: 0 2px;
  }

  /* ---------- Orologio (centrato in alto) ---------- */
  .topclock {
    position: fixed;
    top: 20px;
    left: 0;
    right: 0;
    z-index: 5;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 4px 26px rgba(0,0,0,.6);
  }

  .dayname {
    font-size: clamp(56px, 5vw, 96px);
    font-weight: 600;
    letter-spacing: 10px;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
  }

  .clock-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: min(620px, 80vw);
    gap: 24px;
    margin: 10px auto 0;
  }

  .clock-left {
    display: flex;
    align-items: center;
    gap: 5px;
    pointer-events: auto;
  }

  .date-label {
    font-size: clamp(18px, 1.4vw, 24px);
    letter-spacing: 1.5px;
    opacity: .85;
    cursor: ns-resize;
    pointer-events: auto;
    white-space: nowrap;
  }

  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-nav button {
    width: 22px;
    height: 22px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 6px;
    background: rgba(255,255,255,.08);
    color: #fff;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
  }
  .month-nav button:hover { background: rgba(255,255,255,.2); }

  .time {
    font-size: clamp(20px, 1.5vw, 26px);
    font-weight: 300;
    letter-spacing: 2px;
    opacity: .8;
    margin-top: 0;
    font-variant-numeric: tabular-nums;
    pointer-events: auto;
    white-space: nowrap;
  }

  /* ---------- Colonna sinistra ---------- */
  .left {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 4;
    width: min(700px, 36.5vw);
    display: grid;
    grid-template-columns: 1fr;
    grid-auto-rows: max-content;
    align-content: center;
    justify-items: start;
    gap: 12px;
    padding: 0 20px;
    padding-bottom: 0;
    overflow-y: hidden;
    overflow-x: hidden;
    scrollbar-width: thin;
  }

  .left::-webkit-scrollbar { width: 8px; }
  .left::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }

  .cat-head {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 0;
  }

  .cat-title {
    margin-left: 0;
    text-align: left;
    opacity: .72;
  }

  .cat-tools {
    margin-left: auto;
    display: flex;
    gap: 4px;
    flex: 0 0 auto;
    pointer-events: auto;
  }

  .cat-tools button {
    width: 22px;
    height: 22px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 6px;
    background: rgba(255,255,255,.07);
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
  }
  .cat-tools button:hover { background: rgba(255,255,255,.2); }
  .cat-tools .cat-del:hover { color: #f66; }

  .cat-new,
  .wx-location {
    z-index: 6;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px;
    background: rgba(8,8,10,.7);
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    padding: 5px 12px;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .cat-new { position: absolute; top: 20px; left: 20px; }
  .wx-location { position: fixed; top: 20px; right: 24px; }
  .cat-new:hover,
  .wx-location:hover { background: rgba(255,255,255,.2); }

  .left .card {
    position: relative;
    width: min(425px, 22.5vw);
    padding: 5px 12px;
    justify-content: center;
    gap: 6px;
  }

  .left .card .cat-head,
  .left .card .links {
    position: relative;
    z-index: 1;
  }

  .left .card .links {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
    margin-top: 0;
  }

  .left .card .chip,
  .left .card .links .cat-add {
    width: 100%;
    height: 34px;
    border-radius: 10px;
    font-size: 15px;
  }

  .links {
    display: flex;
    flex-wrap: nowrap;
    justify-content: flex-start;
    gap: 8px;
    margin-top: auto;
  }

  .chip {
    position: relative;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--c, #444);
    color: var(--t, #fff);
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
    transition: transform .15s, filter .15s;
    overflow: visible;
  }

  .chip.phone-only { display: none; }

  /* Sfondo GIF (solo telefono) */
  #gifbg {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: none;
  }

  #gifbg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .chip:hover {
    transform: translateY(-2px) scale(1.07);
    filter: brightness(1.12);
    z-index: 20;
  }

  .chip::after {
    content: attr(data-name);
    position: absolute;
    top: calc(100% + 9px);
    left: 50%;
    transform: translateX(-50%) translateY(-4px);
    background: rgba(6,6,9,.96);
    border: 1px solid rgba(255,255,255,.18);
    color: #fff;
    font-size: 18.0px;
    font-weight: 500;
    letter-spacing: 0.30000000000000004px;
    padding: 5px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s, transform .15s;
    z-index: 30;
  }

  .chip:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Ultima icona a filo destro: tooltip ancorato a destra per non uscire dalla card */
  .links .chip:last-child::after { left: auto; right: 0; transform: translateY(-4px); }
  .links .chip:last-child:hover::after { transform: translateY(0); }

  /* ---------- Colonna destra ---------- */
  .side {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 4;
    width: 33.333vw;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 60px 24px 16px;
    justify-content: flex-start;
    overflow-y: hidden;
    overflow-x: hidden;
    scrollbar-width: thin;
  }

  .side::-webkit-scrollbar { width: 8px; }
  .side::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }

  .card {
    background: rgba(6,6,9,.68);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 20px;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    padding: 18px 22px;
    flex: 1 1 auto;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }

  .card.cal { flex: 1 1 auto; position: relative; min-height: 0; padding-bottom: 52px; }
  .card.grow { flex: 2 1 auto; }

  /* Sfondo GIF delle card meteo */
  .card.wx-card {
    position: relative;
    overflow: hidden;
    flex: 0 0 auto;
    padding: 8px 16px;
  }

  .wx-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: .55;
    z-index: 0;
    pointer-events: none;
  }

  .wx-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(6,6,9,.92) 0%, rgba(6,6,9,.6) 55%, rgba(6,6,9,.25) 100%);
  }

  .wx-card > *:not(.wx-bg) {
    position: relative;
    z-index: 1;
  }

  /* Meteo (card compatte) */
  .wx {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 0 0 auto;
  }

  .wx-icon {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
  }

  .wx-icon svg { width: 40px; height: 40px; }

  .wx-main { flex: 1 1 auto; min-width: 0; }

  .wx-title {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: .65;
  }

  .wx-desc {
    font-size: 20px;
    font-weight: 600;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .wx-temp {
    flex: 0 0 auto;
    font-size: 46px;
    line-height: 1;
    font-weight: 200;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
  }

  .wx-sub {
    font-size: 13px;
    opacity: .6;
    margin-top: 1px;
  }

  /* Striscia meteo settimanale dentro "Tra 12 ore" */
  .wx-week {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 4px;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,.15);
  }

  .wx-week-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 2px;
    border-radius: 8px;
    min-width: 0;
  }

  .wx-week-day.today { background: rgba(255,255,255,.12); }

  .wd-name {
    font-size: 11px;
    letter-spacing: .6px;
    text-transform: uppercase;
    opacity: .7;
    white-space: nowrap;
  }

  .wd-icon { display: grid; place-items: center; height: 20px; }
  .wd-icon svg { width: 20px; height: 20px; }

  .wd-t {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .wd-t b { font-weight: 600; }
  .wd-t span { opacity: .55; }

  /* Calendario con note per ogni giorno */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr);
    gap: 5px;
    flex: 1 1 auto;
    align-content: stretch;
    min-height: 0;
  }

  .cal-grid .dow {
    font-size: 14px;
    opacity: .5;
    padding-bottom: 2px;
    text-transform: uppercase;
    text-align: center;
  }

  .cal-grid .day {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    padding: 4px 5px;
    border-radius: 9px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.07);
    font-variant-numeric: tabular-nums;
  }

  .cal-grid .day.empty { background: transparent; border-color: transparent; }

  .day-num {
    flex: 0 0 auto;
    width: 23px;
    height: 23px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 600;
    opacity: .85;
  }

  .day.today .day-num { background: #fff; color: #111; opacity: 1; }
  .day.has-note { border-color: rgba(255,255,255,.22); }

  .day-note {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.25;
    color: rgba(255,255,255,.92);
    outline: none;
    cursor: text;
    word-break: break-word;
    white-space: pre-wrap;
    scrollbar-width: none;
  }
  .day-note::-webkit-scrollbar { display: none; }
  .day-note:empty::before { content: "+ nota"; color: rgba(255,255,255,.23); }
  .day-note:focus { background: rgba(255,255,255,.08); border-radius: 5px; }

  /* Notepad */
  .note-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 19.5px;
    letter-spacing: 2.7px;
    text-transform: uppercase;
    opacity: .7;
    margin-bottom: 10px;
  }

  #notes {
    width: 100%;
    flex: 1 1 auto;
    min-height: 90px;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-size: 25.5px;
    line-height: 1.5;
  }

  #notes::placeholder { color: rgba(255,255,255,.35); }

  /* ---------- Toast audio ---------- */
  #toast {
    position: fixed;
    left: 24px;
    top: 24px;
    z-index: 7;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 19.5px;
    background: rgba(6,6,9,.72);
    border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(14px);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
  }

  #toast.show { opacity: 1; transform: translateY(0); }
  #toast svg { width: 17px; height: 17px; }

  /* ---------- Overlay "click to play" ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(0,0,0,.55);
    cursor: pointer;
  }

  #overlay.show { display: flex; }

  #overlay .play {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    display: grid;
    place-items: center;
  }

  #overlay .play svg { width: 34px; height: 34px; margin-left: 4px; }
  #overlay p { font-size: 22.5px; opacity: .85; }

  /* ---------- Phone: search only ---------- */
  @media (max-width: 1180px) {
    .left { display: none; }
  }

  @media (max-width: 900px), (max-height: 560px) {
    .side { display: none; }
    .topclock { display: none; }
    .search-wrap { width: 100%; }
    .hint { width: 100%; }
  }

  /* ---------- Phone: categorie collassabili ---------- */
  @media (max-width: 900px) {
    .left {
      display: flex;
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-height: 52vh;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      overflow-y: auto;
      overflow-x: hidden;
    }

    .cat-new { display: none; }

    .left .card {
      flex: 0 0 auto;
      width: 100%;
      padding: 12px 14px;
      gap: 12px;
    }

    .left .card .chip,
    .left .card .links .cat-add {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-size: 18px;
    }

    .left .links { display: none; }

    .left .card.open .links {
      display: grid;
      grid-template-columns: repeat(4, 42px);
      justify-content: end;
      gap: 8px;
      margin-top: 12px;
    }

    .cat-head {
      margin-bottom: 0;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 18px;
    }

    .cat-head::after {
      content: "+";
      font-size: 25.5px;
      font-weight: 400;
      opacity: .85;
    }

    .left .card.open .cat-head::after { content: "\2212"; }

    /* ---------- Phone: giorno, data e ora in alto a sinistra ---------- */
    .topclock {
      display: block;
      top: 32px;
      left: 10px;
      right: auto;
      width: calc(50vw - 14px);
      transform: none;
      text-align: left;
    }

    .topclock .dayname {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      opacity: .8;
    }

    .clock-row { gap: 6px; width: auto; margin: 3px 0 0; }
    .clock-left { gap: 4px; }
    .date-label { font-size: 12px; letter-spacing: .3px; }
    .month-nav { gap: 2px; }
    .month-nav button { width: 16px; height: 16px; font-size: 11px; border-radius: 4px; }

    .topclock .time {
      font-size: 30px;
      font-weight: 300;
      letter-spacing: 1px;
      opacity: .95;
    }

    /* ---------- Phone: meteo e calendario in alto a destra/sinistra ---------- */
    .wx-location { top: 8px; right: 14px; }

    .side {
      display: grid;
      top: 46px;
      left: 10px;
      right: 10px;
      bottom: auto;
      width: auto;
      max-height: 44vh;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 76px 118px 315px 150px;
      align-items: start;
      gap: 8px;
      padding: 0 2px 6px 0;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .side::-webkit-scrollbar { display: none; }

    .side > .card {
      padding: 10px 12px;
      border-radius: 16px;
      box-shadow: 0 10px 26px rgba(0,0,0,.45);
    }

    .side > .card.wx-card { grid-column: 2; }
    .side > #wxCardNow { grid-row: 1; height: 76px; }
    .side > #wxCard12 { grid-row: 2; height: 118px; }
    .side > .card.cal { grid-column: 1 / -1; grid-row: 3; height: 315px; min-height: 0; padding-bottom: 46px; }
    .side > .card.rss { grid-column: 1 / -1; grid-row: 4; min-height: 0; max-height: 150px; padding: 10px 12px; }

    .wx { gap: 8px; }
    .wx-icon { width: 32px; height: 32px; }
    .wx-icon svg { width: 30px; height: 30px; }
    .wx-title { font-size: 14.25px; letter-spacing: 1.2px; white-space: nowrap; }
    .wx-desc, .wx-sub { display: none; }
    .wx-temp { font-size: 36px; letter-spacing: -1px; }

    .wx-week { gap: 2px; margin-top: 6px; padding-top: 6px; }
    .wx-week-day { padding: 2px 0; }
    .wd-name { font-size: 9px; letter-spacing: 0; }
    .wd-icon { height: 18px; }
    .wd-icon svg { width: 18px; height: 18px; }
    .wd-t { font-size: 10px; }

    /* Località fuori dalle card, in alto */
    .wx-place.phone-place {
      position: fixed;
      top: 7px;
      left: 0;
      right: 0;
      width: auto;
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 0;
      padding: 0 12px;
      font-size: 16.5px;
      letter-spacing: 1.7999999999999998px;
      opacity: .85;

<script>
  var VIDEO_ID = "rFZHOHl-L8A";
  var SEARCH_URL = "https://www.google.com/search?q=";
  var BASE_W = 1920;
  var BASE_H = 1080;
  var OVERSCAN = 1.04;

  var player = null;
  var muted = true;
  var overlay = document.getElementById("overlay");

  /* Su telefono lo sfondo è la GIF: niente player YouTube */
  var isPhone = window.matchMedia("(max-width: 900px)").matches;

  /* ================= YouTube player ================= */
  if (!isPhone) {
    var tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      videoId: VIDEO_ID,
      host: "https://www.youtube-nocookie.com",
      width: BASE_W,
      height: BASE_H,
      playerVars: {
        autoplay: 1, loop: 1, playlist: VIDEO_ID, controls: 0, disablekb: 1,
        modestbranding: 1, playsinline: 1, fs: 0, iv_load_policy: 3,
        cc_load_policy: 0, rel: 0
      },
      events: {
        onReady: function (e) {
          e.target.mute();
          e.target.playVideo();
          fitPlayer();
          overlay.classList.remove("show");
        },
        onError: function () { overlay.classList.add("show"); },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) overlay.classList.remove("show");
        }
      }
    });
  }

  function fitPlayer() {
    var el = document.getElementById("player");
    if (!el) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var k = Math.max(vw / BASE_W, vh / BASE_H) * OVERSCAN;
    el.style.width = BASE_W + "px";
    el.style.height = BASE_H + "px";
    el.style.left = Math.round((vw - BASE_W) / 2) + "px";
    el.style.top = Math.round((vh - BASE_H) / 2) + "px";
    el.style.transform = "scale(" + k + ")";
  }

  fitPlayer();
  window.addEventListener("resize", fitPlayer);
  window.addEventListener("orientationchange", function () { setTimeout(fitPlayer, 300); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fitPlayer);

  overlay.addEventListener("click", function () {
    if (player && player.playVideo) { player.mute(); player.playVideo(); }
    overlay.classList.remove("show");
  });

  /* ================= Audio on background click ================= */
  var ICON_MUTED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M22 9l-6 6M16 9l6 6"></path></svg>';
  var ICON_SOUND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M16.5 8.5a5 5 0 010 7"></path><path d="M19.5 5.5a9 9 0 010 13"></path></svg>';

  var toast = document.getElementById("toast");
  var toastTimer = null;

  function showToast(text, icon) {
    document.getElementById("toastText").textContent = text;
    document.getElementById("toastIcon").innerHTML = icon;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1600);
  }

  function toggleAudio() {
    if (!player) return;
    muted = !muted;
    if (player && player.mute && player.unMute) {
      muted ? player.mute() : player.unMute();
    }
    showToast(muted ? "Audio disattivato" : "Audio attivo", muted ? ICON_MUTED : ICON_SOUND);
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest("input, textarea, button, select, a, .side, .left, #overlay")) return;
    toggleAudio();
  });

  /* ================= Orologio ================= */
  var DOW = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
  var MONTHS = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio",
                "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
  var MONTHS_SHORT = ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"];

  function tick() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    document.getElementById("dayName").textContent = DOW[d.getDay()];
    document.getElementById("time").textContent =
      (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  }
  tick();
  setInterval(tick, 1000);

  /* ================= Weather (Open-Meteo) ================= */
  var WMO = {
    0:  ["Sereno", "sun"],
    1:  ["Prevalentemente sereno", "partly"],
    2:  ["Parzialmente nuvoloso", "partly"],
    3:  ["Coperto", "cloud"],
    45: ["Nebbia", "fog"],
    48: ["Nebbia con brina", "fog"],
    51: ["Pioviggine leggera", "rain"],
    53: ["Pioviggine", "rain"],
    55: ["Pioviggine forte", "rain"],
    56: ["Pioviggine gelata", "rain"],
    57: ["Pioviggine gelata forte", "rain"],
    61: ["Pioggia leggera", "rain"],
    63: ["Pioggia", "rain"],
    65: ["Pioggia forte", "rain"],
    66: ["Pioggia gelata", "rain"],
    67: ["Pioggia gelata forte", "rain"],
    71: ["Neve leggera", "snow"],
    73: ["Neve", "snow"],
    75: ["Neve abbondante", "snow"],
    77: ["Granelli di neve", "snow"],
    80: ["Rovesci leggeri", "rain"],
    81: ["Rovesci", "rain"],
    82: ["Rovesci violenti", "rain"],
    85: ["Rovesci di neve", "snow"],
    86: ["Rovesci di neve forti", "snow"],
    95: ["Temporale", "storm"],
    96: ["Temporale con grandine", "storm"],
    99: ["Temporale con grandine forte", "storm"]
  };

  var ICONS = {
    sun:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>',
    partly: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"></circle><path d="M8 1.8v1.6M1.8 8h1.6M3.6 3.6l1.1 1.1M12.4 3.6l-1.1 1.1"></path><path d="M9.5 19.5h8a3.6 3.6 0 00.3-7.2A5 5 0 007.2 13 3.3 3.3 0 009.5 19.5z"></path></svg>',
    cloud:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 19h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 11.4 4 4 0 007.5 19z"></path></svg>',
    fog:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7.5 14h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 6.4 4 4 0 007.5 14z"></path><path d="M4 17h16M6 20.5h12"></path></svg>',
    rain:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 7.4 4 4 0 007.5 15z"></path><path d="M8.5 18l-1 3M13 18l-1 3M17.5 18l-1 3"></path></svg>',
    snow:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 7.4 4 4 0 007.5 15z"></path><path d="M8 18v3M6.6 18.8l2.8 1.4M9.4 18.8l-2.8 1.4M16 18v3M14.6 18.8l2.8 1.4M17.4 18.8l-2.8 1.4"></path></svg>',
    storm:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 7.4 4 4 0 007.5 15z"></path><path d="M13 16l-3 4h4l-2 3.5"></path></svg>'
  };

  function wxInfo(code) {
    var e = WMO[code] || ["Sconosciuto", "cloud"];
    return { desc: e[0], key: e[1], icon: ICONS[e[1]] || ICONS.cloud };
  }

  /* Sfondo GIF della card meteo, in base all'icona */
  function setWxBg(id, key) {
    var el = document.getElementById(id);
    if (el) el.style.backgroundImage = "url('GIFs/" + key + ".gif')";
  }

  /* Città predefinita: Camaiore (Lucca) */
  var DEFAULT_CITY = { name: "Camaiore (Lucca)", lat: 43.94265, lon: 10.29754 };

  function geocode(name) {
    return fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(name) +
                 "&count=1&language=it&format=json")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var r = (j.results || [])[0];
        if (!r) throw new Error("Città non trovata");
        return { name: r.name, lat: r.latitude, lon: r.longitude };
      });
  }

  function locate() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem("sp_city2")); } catch (e) {}
    return Promise.resolve(saved || DEFAULT_CITY);
  }

  function loadWeather() {
    locate().then(function (city) {
      if (!city) return;
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + city.lat + "&longitude=" + city.lon +
        "&current=temperature_2m,apparent_temperature,weather_code" +
        "&hourly=temperature_2m,weather_code,precipitation_probability" +
        "&daily=temperature_2m_max,temperature_2m_min,weather_code" +
        "&timezone=auto&forecast_days=7";
      return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
        renderWeather(city, j);
      });
    }).catch(function () {
      document.getElementById("wxDescNow").textContent = "Meteo non disponibile";
    });
  }

  function renderWeather(city, j) {
    document.getElementById("wxCity").textContent = city.name;
    try { localStorage.setItem("sp_city2", JSON.stringify(city)); } catch (e) {}

    var cur = j.current || {};
    var now = wxInfo(cur.weather_code);
    document.getElementById("wxIconNow").innerHTML = now.icon;
    document.getElementById("wxDescNow").textContent = now.desc;
    document.getElementById("wxTempNow").textContent = Math.round(cur.temperature_2m) + "°";
    setWxBg("wxBgNow", now.key);
    var d0 = j.daily || {};
    var sub = "";
    if (d0.temperature_2m_max && d0.temperature_2m_min) {
      sub += "min " + Math.round(d0.temperature_2m_min[0]) + "° · max " + Math.round(d0.temperature_2m_max[0]) + "°";
    }
    if (cur.apparent_temperature != null) sub += (sub ? " · " : "") + "percepita " + Math.round(cur.apparent_temperature) + "°";
    document.getElementById("wxSubNow").textContent = sub;

    /* Meteo di domani */
    if (d0.time && d0.time.length > 1) {
      var f = wxInfo(d0.weather_code ? d0.weather_code[1] : null);
      var hiTomorrow = d0.temperature_2m_max ? Math.round(d0.temperature_2m_max[1]) : null;
      var loTomorrow = d0.temperature_2m_min ? Math.round(d0.temperature_2m_min[1]) : null;
      document.getElementById("wxIcon12").innerHTML = f.icon;
      document.getElementById("wxDesc12").textContent = f.desc;
      document.getElementById("wxTemp12").textContent = hiTomorrow != null ? hiTomorrow + "°" : "--°";
      setWxBg("wxBg12", f.key);
      document.getElementById("wxSub12").textContent = (loTomorrow != null && hiTomorrow != null)
        ? "min " + loTomorrow + "° · max " + hiTomorrow + "°" : "";
    }

    /* Striscia con il meteo di tutta la settimana */
    var weekEl = document.getElementById("wxWeek");
    if (weekEl && d0.time && d0.time.length) {
      var shortDays = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
      var weekHtml = "";
      for (var w = 2; w < d0.time.length; w++) {
        var wi = wxInfo(d0.weather_code[w]);
        var wd = new Date(d0.time[w] + "T00:00").getDay();
        var label = shortDays[wd];
        weekHtml += '<div class="wx-week-day" title="' + label + ': ' + wi.desc + '">' +
          '<span class="wd-name">' + label + '</span>' +
          '<span class="wd-icon">' + wi.icon + '</span>' +
          '</div>';
      }
      weekEl.innerHTML = weekHtml;
    }
  }

  document.getElementById("wxCity").addEventListener("click", function () {
    var name = prompt("Città per il meteo:", this.textContent.trim());
    if (!name) return;
    geocode(name).then(function (c) {
      localStorage.setItem("sp_city2", JSON.stringify(c));
      loadWeather();
    }).catch(function (err) { alert(err.message || "Città non trovata"); });
  });

  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);

  /* ================= Calendar con note per ogni giorno ================= */
  var NOTE_KEY = "sp_cal_notes";
  var calNow = new Date();
  var calYear = calNow.getFullYear();
  var calMonth = calNow.getMonth();
  var calDay = calNow.getDate();

  function loadDayNotes() {
    try { return JSON.parse(localStorage.getItem(NOTE_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function saveDayNotes(notes) {
    try { localStorage.setItem(NOTE_KEY, JSON.stringify(notes)); } catch (e) {}
  }
  function dateKey(y, m, d) {
    return y + "-" + ("0" + (m + 1)).slice(-2) + "-" + ("0" + d).slice(-2);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function updateDateLabel() {
    document.getElementById("dateLabel").textContent = calDay + " " + MONTHS_SHORT[calMonth] + " " + calYear;
  }

  function renderCalendar() {
    var today = new Date();

    var first = new Date(calYear, calMonth, 1);
    var days = new Date(calYear, calMonth + 1, 0).getDate();
    var offset = (first.getDay() + 6) % 7; /* la settimana parte dal lunedì */
    var notes = loadDayNotes();

    var heads = [["L", "Lun"], ["M", "Mar"], ["M", "Mer"], ["G", "Gio"], ["V", "Ven"], ["S", "Sab"], ["D", "Dom"]];
    var html = heads.map(function (x) {

  function fetchWithTimeout(url, ms) {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, ms) : null;
    return fetch(url, { signal: ctrl ? ctrl.signal : undefined, cache: "no-store" })
      .then(function (r) {
        if (timer) clearTimeout(timer);
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        throw err;
      });
  }

  /* Prova più proxy pubblici per aggirare il blocco CORS dei feed */
  function fetchRssXml(url) {
    var proxies = [
      function (u) { return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); },
      function (u) { return "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u); },
      function (u) { return "https://corsproxy.io/?" + encodeURIComponent(u); }
    ];
    var i = 0;
    function next() {
      if (i >= proxies.length) return Promise.reject(new Error("Feed non raggiungibile"));
      var makeUrl = proxies[i++];
      return fetchWithTimeout(makeUrl(url), 7000).then(function (text) {
        if (!text || !/<(rss|feed|rdf)/i.test(text)) throw new Error("Risposta non valida");
        return text;
      }).catch(next);
    }
    return next();
  }

  function parseRss(text, source) {
    var doc = new DOMParser().parseFromString(text, "application/xml");
    var nodes = doc.getElementsByTagName("item");
    if (!nodes.length) nodes = doc.getElementsByTagName("entry"); /* Atom */
    var out = [];
    for (var i = 0; i < nodes.length && i < 6; i++) {
      var n = nodes[i];
      function val(tag) {
        var c = n.getElementsByTagName(tag)[0];
        return c ? (c.textContent || "").trim() : "";
      }
      var title = val("title") || "(senza titolo)";
      var link = val("link");
      var linkEl = n.getElementsByTagName("link")[0];
      if (!link && linkEl && linkEl.getAttribute) link = linkEl.getAttribute("href") || "";
      if (!link) continue;
      out.push({
        title: title,
        link: link,
        source: source,
        date: val("pubDate") || val("updated") || val("published")
      });
    }
    return out;
  }

  function refreshRss() {
    var box = document.getElementById("rssItems");
    if (!box) return;
    if (!rssFeeds.length) {
      box.innerHTML = '<div class="rss-empty">Nessun feed. Clicca «+ Feed» per aggiungerne uno.</div>';
      setRssStatus("");
      return;
    }
    box.innerHTML = '<div class="rss-empty">Caricamento feed...</div>';
    setRssStatus("Aggiornamento...");

    Promise.all(rssFeeds.map(function (url) {
      return fetchRssXml(url)
        .then(function (text) { return parseRss(text, rssHost(url)); })
        .catch(function () {
          return [{ error: true, title: "Feed non disponibile: " + rssHost(url), link: url, source: "", date: "" }];
        });
    })).then(function (groups) {
      var items = [];
      groups.forEach(function (g) { items = items.concat(g); });
      items.sort(function (a, b) {
        return (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0);
      });
      items = items.slice(0, 12);

      if (!items.length) {
        box.innerHTML = '<div class="rss-empty">Nessun articolo trovato.</div>';
      } else {
        box.innerHTML = items.map(function (it) {
          if (it.error) return '<div class="rss-error">' + escapeHtml(it.title) + "</div>";
          return '<div class="rss-item"><span class="rss-src">' + escapeHtml(it.source) + "</span>" +
            '<a href="' + escapeHtml(it.link) + '" target="_blank" rel="noopener" title="' + escapeHtml(it.title) + '">' +
            escapeHtml(it.title) + "</a></div>";
        }).join("");
      }
      var d = new Date();
      setRssStatus("Aggiornato " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2));
    });
  }

  function startRelaxingRingtone() {
    stopRelaxingRingtone();
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      alarmAudioCtx = new Ctx();
      alarmGain = alarmAudioCtx.createGain();
      alarmGain.gain.value = 0.0001;
      alarmGain.connect(alarmAudioCtx.destination);
      // gentle layered tones
      var freqs = [261.63, 329.63, 392.00, 523.25]; // C major chord
      freqs.forEach(function (f, i) {
        var o = alarmAudioCtx.createOscillator();
        o.type = 'sine';
        o.frequency.value = f;
        var g = alarmAudioCtx.createGain();
        g.gain.value = 0.03;
        o.connect(g); g.connect(alarmGain);
        o.start();
        alarmOscNodes.push(o, g);
      });
      // slow swell
      var now = alarmAudioCtx.currentTime;
      alarmGain.gain.setValueAtTime(0.0001, now);
      alarmGain.gain.exponentialRampToValueAtTime(0.12, now + 4);
      alarmInterval = setInterval(function () {
        if (!alarmAudioCtx || !alarmGain) return;
        var t = alarmAudioCtx.currentTime;
        alarmGain.gain.cancelScheduledValues(t);
        alarmGain.gain.setValueAtTime(alarmGain.gain.value, t);
        alarmGain.gain.exponentialRampToValueAtTime(0.04, t + 2);
        alarmGain.gain.exponentialRampToValueAtTime(0.12, t + 4);
      }, 4000);
    } catch (e) {}
  }
  function stopRelaxingRingtone() {
    if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
    if (alarmOscNodes) {
      alarmOscNodes.forEach(function (n) { try { if (n.stop) n.stop(); if (n.disconnect) n.disconnect(); } catch (e) {} });
      alarmOscNodes = [];
    }
    if (alarmGain) { try { alarmGain.disconnect(); } catch (e) {} alarmGain = null; }
    if (alarmAudioCtx) { try { alarmAudioCtx.close(); } catch (e) {} alarmAudioCtx = null; }
  }

  function triggerAlarm(a) {
    activeAlarmRinging = a;
    var banner = document.getElementById('alarmBanner');
    document.getElementById('alarmBannerText').textContent = 'Sveglia ' + a.time;
    banner.classList.add('show');
    startRelaxingRingtone();
  }

  document.getElementById('alarmStop').addEventListener('click', function () {
    document.getElementById('alarmBanner').classList.remove('show');
    stopRelaxingRingtone();
    activeAlarmRinging = null;
  });

  function checkAlarms() {
    var now = new Date();
    var hh = ('0' + now.getHours()).slice(-2);
    var mm = ('0' + now.getMinutes()).slice(-2);
    var cur = hh + ':' + mm;
    var key = now.getFullYear() + '-' + (now.getMonth()+1) + '-' + now.getDate() + ' ' + cur;
    var list = loadAlarms();
    var changed = false;
    list.forEach(function (a) {
      if (a.time === cur && a.lastFired !== key && !activeAlarmRinging) {
        a.lastFired = key;
        changed = true;
        triggerAlarm(a);
      }
    });
    if (changed) saveAlarms(list);
  }
  setInterval(checkAlarms, 1000);

</script>
</body>
</html>
