<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Start</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
  }

  /* ---------- Background ---------- */
  #bg {
    position: fixed;
    inset: 0;
    background: #000 center/cover no-repeat;
    z-index: 0;
  }

  #player {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    pointer-events: none;
    z-index: 1;
  }

  /* ---------- Content ---------- */
  .stage {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
  }

  /* ---------- Search ---------- */
  .search-wrap {
    position: relative;
    width: min(700px, 100%);
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 22px;
    border-radius: 999px;
    background: rgba(20,20,24,.42);
    border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 14px 44px rgba(0,0,0,.45);
    transition: background .2s, border-color .2s, box-shadow .2s;
  }

  .search-box:focus-within {
    background: rgba(20,20,24,.58);
    border-color: rgba(255,255,255,.55);
    box-shadow: 0 16px 52px rgba(0,0,0,.55);
  }

  .search-box svg {
    flex: 0 0 auto;
    width: 21px;
    height: 21px;
    opacity: .9;
  }

  #q {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #fff;
    font-size: 17px;
    padding: 14px 0;
  }

  #q::placeholder { color: rgba(255,255,255,.65); }

  .hint {
    font-size: 12.5px;
    letter-spacing: .4px;
    opacity: .55;
  }

  .hint kbd {
    font-family: inherit;
    font-size: 11px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 5px;
    padding: 1px 5px;
    margin: 0 2px;
  }

  /* ---------- Sound toggle ---------- */
  #sound {
    position: fixed;
    right: 20px;
    top: 20px;
    z-index: 4;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(12px);
    color: #fff;
    cursor: pointer;
    opacity: .6;
    transition: opacity .2s, transform .2s;
  }

  #sound:hover { opacity: 1; transform: scale(1.06); }
  #sound svg { width: 20px; height: 20px; }

  @media (max-width: 520px) {
    .search-box { padding: 4px 18px; }
    #q { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="player"></div>

<div class="stage">
  <form class="search-wrap" id="form" autocomplete="off">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="q" type="text" placeholder="Cerca su Google..." autofocus spellcheck="false">
    </div>
  </form>

  <div class="hint"><kbd>/</kbd> per cercare &nbsp;·&nbsp; <kbd>Esc</kbd> per uscire</div>
</div>

<button id="sound" title="Attiva/disattiva audio">
  <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
    <path d="M16.5 8.5a5 5 0 010 7"></path>
    <path d="M19.5 5.5a9 9 0 010 13"></path>
  </svg>
</button>

<script>
  var VIDEO_ID = "rFZHOHl-L8A";
  var SEARCH_URL = "https://www.google.com/search?q=";

  /* ---------- Background fallback (thumbnail) ---------- */
  document.getElementById("bg").style.backgroundImage =
    "url(https://i.ytimg.com/vi/" + VIDEO_ID + "/maxresdefault.jpg)";

  /* ---------- YouTube player ---------- */
  var player = null;
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      videoId: VIDEO_ID,
      host: "https://www.youtube-nocookie.com",
      playerVars: {
        autoplay: 1,
        loop: 1,
        playlist: VIDEO_ID,
        controls: 0,
        disablekb: 1,
        modestbranding: 1,
        playsinline: 1,
        fs: 0,
        iv_load_policy: 3,
        cc_load_policy: 0,
        rel: 0
      },
      events: {
        onReady: function (e) {
          e.target.mute();
          e.target.playVideo();
          fitPlayer();
        }
      }
    });
  }

  /* ---------- Fit video to screen (cover, no black bars) ---------- */
  function fitPlayer() {
    var el = document.getElementById("player");
    if (!el) return;
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var ar = 16 / 9;
    var w, h;
    if (vw / vh > ar) {
      h = vh; w = h * ar;
    } else {
      w = vw; h = w / ar;
    }
    el.style.width = w + "px";
    el.style.height = h + "px";
    el.style.left = Math.round((vw - w) / 2) + "px";
    el.style.top = Math.round((vh - h) / 2) + "px";
  }

  fitPlayer();
  window.addEventListener("resize", fitPlayer);
  window.addEventListener("orientationchange", function () {
    setTimeout(fitPlayer, 250);
  });

  /* ---------- Search ---------- */
  var form = document.getElementById("form");
  var q = document.getElementById("q");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var term = q.value.trim();
    if (!term) return;
    window.location.href = SEARCH_URL + encodeURIComponent(term);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== q) {
      e.preventDefault();
      q.focus();
      q.select();
    } else if (e.key === "Escape") {
      q.blur();
    }
  });

  /* ---------- Sound ---------- */
  var soundBtn = document.getElementById("sound");
  var icon = document.getElementById("soundIcon");
  var muted = true;

  soundBtn.addEventListener("click", function () {
    muted = !muted;
    if (player && player.mute && player.unMute) {
      muted ? player.mute() : player.unMute();
    }
    icon.innerHTML = muted
      ? '<path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M22 9l-6 6M16 9l6 6"></path>'
      : '<path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M16.5 8.5a5 5 0 010 7"></path><path d="M19.5 5.5a9 9 0 010 13"></path>';
  });
</script>
</body>
</html>
