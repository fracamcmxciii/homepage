<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Start</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Video (cover: riempie lo schermo, ritagliato) ---------- */
  #player {
    position: fixed;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    border: 0;
    pointer-events: none;
    z-index: 1;
    transform-origin: center center;
    will-change: transform;
  }

  /* ---------- Ricerca (in basso al centro) ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    padding: 24px 24px calc(28px + env(safe-area-inset-bottom));
    pointer-events: none;
  }

  .search-wrap {
    position: relative;
    width: min(620px, calc(100vw - 48px));
    pointer-events: auto;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 22px;
    border-radius: 999px;
    background: rgba(8,8,10,.62);
    border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 14px 44px rgba(0,0,0,.55);
    transition: background .2s, border-color .2s, box-shadow .2s;
  }

  .search-box:focus-within {
    background: rgba(8,8,10,.78);
    border-color: rgba(255,255,255,.45);
    box-shadow: 0 16px 52px rgba(0,0,0,.65);
  }

  .search-box svg { flex: 0 0 auto; width: 21px; height: 21px; opacity: .9; }

  #q {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #fff;
    font-size: 17px;
    padding: 14px 0;
  }

  #q::placeholder { color: rgba(255,255,255,.6); }

  .hint {
    font-size: 12.5px;
    letter-spacing: .4px;
    opacity: .55;
    padding-left: 4px;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }

  .hint kbd {
    font-family: inherit;
    font-size: 11px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 5px;
    padding: 1px 5px;
    margin: 0 2px;
  }

  /* ---------- Orologio (in alto al centro) ---------- */
  .topclock {
    position: fixed;
    top: 26px;
    left: 0;
    right: 0;
    z-index: 5;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 4px 26px rgba(0,0,0,.6);
  }

  .dayname {
    font-size: clamp(36px, 4.4vw, 64px);
    font-weight: 200;
    letter-spacing: 7px;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
  }

  .time {
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 3px;
    opacity: .8;
    margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Colonna sinistra ---------- */
  .left {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 4;
    width: min(850px, 45vw);
    display: grid;
    grid-template-columns: max-content;
    grid-auto-rows: minmax(min-content, 1fr);
    gap: 14px;
    padding: 24px 20px calc(48px + env(safe-area-inset-bottom));
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
  }

  .left::-webkit-scrollbar { width: 8px; }
  .left::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }

  .cat-head {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .cat-title {
    margin-left: auto;
    text-align: right;
    opacity: .72;
  }

  .left .card {
    position: relative;
  }

  .left .card .cat-head,
  .left .card .links {
    position: relative;
    z-index: 1;
  }

  .cat-gif {
    position: absolute;
    top: 6px;
    left: 6px;
    height: calc(100% - 12px);
    width: auto;
    border-radius: 12px;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
    display: block;
  }

  .links {
    display: flex;
    flex-wrap: nowrap;
    justify-content: flex-start;
    gap: 8px;
    margin-top: auto;
  }

  /* GIF della colonna sinistra al 50% di opacità */
  .left .cat-gif { opacity: .5; }

  .chip {
    position: relative;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--c, #444);
    color: var(--t, #fff);
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .5px;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
    transition: transform .15s, filter .15s;
  }

  .chip img,
  .chip .ico {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 23px;
    height: 23px;
    object-fit: contain;
  }

  .chip.fav img { filter: brightness(0) invert(1); }

  .chip.wide img {
    width: 32px;
    height: 11px;
    filter: brightness(0) invert(1);
  }

  .chip.phone-only { display: none; }

  /* Sfondo GIF (solo telefono) */
  #gifbg {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: none;
  }

  #gifbg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .chip:hover {
    transform: translateY(-2px) scale(1.07);
    filter: brightness(1.12);
    z-index: 20;
  }

  .chip::after {
    content: attr(data-name);
    position: absolute;
    top: calc(100% + 9px);
    left: 50%;
    transform: translateX(-50%) translateY(-4px);
    background: rgba(6,6,9,.96);
    border: 1px solid rgba(255,255,255,.18);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .2px;
    padding: 5px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s, transform .15s;
    z-index: 30;
  }

  .chip:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Ultima icona a filo destro: tooltip ancorato a destra per non uscire dalla card */
  .links .chip:last-child::after { left: auto; right: 0; transform: translateY(-4px); }
  .links .chip:last-child:hover::after { transform: translateY(0); }

  /* ---------- Colonna destra ---------- */
  .side {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 4;
    width: min(850px, 45vw);
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    justify-content: flex-start;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
  }

  .side::-webkit-scrollbar { width: 8px; }
  .side::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }

  .card {
    background: rgba(6,6,9,.68);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 20px;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    padding: 18px 22px;
    flex: 1 1 auto;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }

  .card.cal { flex: 0 0 auto; }
  .card.grow { flex: 2 1 auto; }

  /* Sfondo GIF delle card meteo */
  .card.wx-card {
    position: relative;
    overflow: hidden;
  }

  .wx-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: .55;
    z-index: 0;
    pointer-events: none;
  }

  .wx-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(6,6,9,.92) 0%, rgba(6,6,9,.6) 55%, rgba(6,6,9,.25) 100%);
  }

  .wx-card > *:not(.wx-bg) {
    position: relative;
    z-index: 1;
  }

  /* Meteo */
  .wx {
    display: flex;
    align-items: center;
    gap: 20px;
    flex: 1 1 auto;
  }

  .wx-icon {
    flex: 0 0 auto;
    width: 74px;
    height: 74px;
    display: grid;
    place-items: center;
  }

  .wx-icon svg { width: 64px; height: 64px; }

  .wx-main { flex: 1 1 auto; min-width: 0; }

  .wx-title {
    font-size: 14px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    opacity: .65;
  }

  .wx-desc {
    font-size: 21px;
    font-weight: 600;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .wx-temp {
    flex: 0 0 auto;
    font-size: 56px;
    font-weight: 200;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
  }

  .wx-sub {
    font-size: 14.5px;
    opacity: .6;
    margin-top: 4px;
  }

  .wx-place {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    opacity: .7;
    margin-bottom: 14px;
  }

  .wx-place b { font-weight: 700; opacity: 1; cursor: pointer; text-transform: none; letter-spacing: .2px; }
  .wx-place b:hover { text-decoration: underline; }

  /* Calendario */
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    opacity: .8;
    margin-bottom: 14px;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
    flex: 1 1 auto;
    align-content: start;
  }

  .cal-grid .dow {
    font-size: 11.5px;
    opacity: .5;
    padding-bottom: 5px;
    text-transform: uppercase;
  }

  .cal-grid .day {
    font-size: 15px;
    padding: 6px 0;
    border-radius: 10px;
    opacity: .85;
    font-variant-numeric: tabular-nums;
  }

  .cal-grid .day.empty { opacity: 0; }
  .cal-grid .day.today {
    background: #fff;
    color: #111;
    font-weight: 700;
    opacity: 1;
  }

  /* Notepad */
  .note-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    opacity: .7;
    margin-bottom: 10px;
  }

  #notes {
    width: 100%;
    flex: 1 1 auto;
    min-height: 90px;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    line-height: 1.5;
  }

  #notes::placeholder { color: rgba(255,255,255,.35); }

  /* GIF nella card Note */
  .card.note-card {
    position: relative;
    background: #060609;
  }

  .note-gif {
    position: absolute;
    right: 6px;
    bottom: 6px;
    height: calc(100% - 12px);
    width: auto;
    border-radius: 12px;
    opacity: .1;
    z-index: 0;
    pointer-events: none;
    display: block;
  }

  .card.note-card > *:not(.note-gif) {
    position: relative;
    z-index: 1;
  }

  /* ---------- Toast audio ---------- */
  #toast {
    position: fixed;
    left: 24px;
    top: 24px;
    z-index: 7;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13px;
    background: rgba(6,6,9,.72);
    border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(14px);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
  }

  #toast.show { opacity: 1; transform: translateY(0); }
  #toast svg { width: 17px; height: 17px; }

  /* ---------- Overlay "click to play" ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(0,0,0,.55);
    cursor: pointer;
  }

  #overlay.show { display: flex; }

  #overlay .play {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    display: grid;
    place-items: center;
  }

  #overlay .play svg { width: 34px; height: 34px; margin-left: 4px; }
  #overlay p { font-size: 15px; opacity: .85; }

  /* ---------- Phone: search only ---------- */
  @media (max-width: 1180px) {
    .left { display: none; }
  }

  @media (max-width: 900px), (max-height: 560px) {
    .side { display: none; }
    .topclock { display: none; }
    .search-wrap { width: 100%; }
  }

  /* ---------- Phone: categorie collassabili ---------- */
  @media (max-width: 900px) {
    .left {
      display: flex;
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-height: 52vh;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      overflow-y: auto;
      overflow-x: hidden;
    }

    .left .card {
      flex: 0 0 auto;
      width: 100%;
      padding: 12px 14px;
    }

    .left .links { display: none; }

    .left .card.open .links {
      display: grid;
      grid-template-columns: repeat(4, 42px);
      justify-content: end;
      gap: 8px;
      margin-top: 12px;
    }

    .cat-head {
      margin-bottom: 0;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cat-head::after {
      content: "+";
      font-size: 17px;
      font-weight: 400;
      opacity: .85;
    }

    .left .card.open .cat-head::after { content: "\2212"; }

    /* ---------- Phone: ora in alto a sinistra ---------- */
    .topclock {
      display: flex;
      top: 34px;
      left: 10px;
      right: auto;
      width: calc(50vw - 14px);
      flex-direction: column-reverse;
      align-items: flex-start;
      text-align: left;
    }

    .topclock .time {
      font-size: 40px;
      font-weight: 300;
      letter-spacing: 1px;
      margin-top: 0;
      opacity: .95;
    }

    .topclock .dayname {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 4px;
      opacity: .8;
    }

    /* ---------- Phone: meteo e calendario in alto a destra/sinistra ---------- */
    .side {
      display: grid;
      top: 32px;
      left: 10px;
      right: 10px;
      bottom: auto;
      width: auto;
      max-height: none;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 76px auto;
      align-items: start;
      gap: 8px;
      padding: 0;
      overflow: visible;
    }

    .side > .card {
      padding: 10px 12px;
      border-radius: 16px;
      box-shadow: 0 10px 26px rgba(0,0,0,.45);
    }

    .side > .card.wx-card { grid-column: 2; }
    .side > #wxCardNow { grid-row: 1; height: 76px; }
    .side > #wxCard12 { grid-row: 2; height: 76px; }
    .side > .card.cal { grid-column: 1; grid-row: 2; }
    .side > .card.note-card { display: none; }

    .wx { gap: 8px; }
    .wx-icon { width: 32px; height: 32px; }
    .wx-icon svg { width: 30px; height: 30px; }
    .wx-title { font-size: 9.5px; letter-spacing: .8px; white-space: nowrap; }
    .wx-desc, .wx-sub { display: none; }
    .wx-temp { font-size: 24px; letter-spacing: -1px; }

    /* Località fuori dalle card, in alto */
    .wx-place.phone-place {
      position: fixed;
      top: 7px;
      left: 0;
      right: 0;
      width: auto;
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 0;
      padding: 0 12px;
      font-size: 11px;
      letter-spacing: 1.2px;
      opacity: .85;
      z-index: 6;
    }
    .wx-place.phone-place span { display: none; }
    .wx-place.phone-place b {
      font-size: 12px;
      max-width: 92vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .side .cal-head { font-size: 10.5px; letter-spacing: 1px; margin-bottom: 8px; }
    .side .cal-grid { gap: 2px; }
    .side .cal-grid .dow { font-size: 9px; padding-bottom: 3px; }
    .side .cal-grid .day { font-size: 11.5px; padding: 4px 0; border-radius: 7px; }

    /* Solo telefono */
    .stage { display: none; }
    #player { display: none; }
    #gifbg { display: block; }

    .chip.phone-only { display: grid; }
    .cat-gif { top: 4px; left: 4px; height: calc(100% - 8px); width: auto; opacity: .5; }

    /* Velo nero 10% davanti alla GIF */
    #gifbg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.1);
    }

    .left .card[data-cat="google"],
    .left .card[data-cat="image"],
    .left .card[data-cat="lab"] { display: none; }
  }

  @media (max-width: 520px) {
    .search-box { padding: 4px 18px; }
    #q { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="player"></div>
<div id="gifbg"><img src="GIFs/tenor.gif" alt=""></div>

<aside class="left">
  <div class="card" data-cat="social">
    <img class="cat-gif" src="GIFs/01.gif" alt="">
    <div class="cat-head"><span class="cat-title">Social</span></div>
    <div class="links">
      <a class="chip" style="--c:#FF4500" data-name="Reddit" href="https://www.reddit.com/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/reddit/fff" alt="Reddit" onerror="this.remove()"></a>
      <a class="chip" style="--c:#229ED9" data-name="Telegram" href="https://web.telegram.org/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/telegram/fff" alt="Telegram" onerror="this.remove()"></a>
      <a class="chip" style="--c:#1877F2" data-name="Facebook" href="https://www.facebook.com/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/facebook/fff" alt="Facebook" onerror="this.remove()"></a>
      <a class="chip" style="--c:#E4405F" data-name="Instagram" href="https://www.instagram.com/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/instagram/fff" alt="Instagram" onerror="this.remove()"></a>
      <a class="chip" style="--c:#F5C518;--t:#111" data-name="IMDb" href="https://www.imdb.com/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/imdb/fff" alt="IMDb" onerror="this.remove()"></a>
      <a class="chip phone-only" style="--c:#FF0000" data-name="YouTube" href="https://www.youtube.com/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/youtube/fff" alt="YouTube" onerror="this.remove()"></a>
      <a class="chip phone-only" style="--c:#E60023" data-name="Pinterest" href="https://www.pinterest.com/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/pinterest/fff" alt="Pinterest" onerror="this.remove()"></a>
    </div>
  </div>

  <div class="card" data-cat="google">
    <img class="cat-gif" src="GIFs/09.gif" alt="">
    <div class="cat-head"><span class="cat-title">Google</span></div>
    <div class="links">
      <a class="chip" style="--c:#FF0000" data-name="YouTube" href="https://www.youtube.com/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/youtube/fff" alt="YouTube" onerror="this.remove()"></a>
      <a class="chip" style="--c:#0F9D58" data-name="Drive" href="https://drive.google.com/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/googledrive/fff" alt="Google Drive" onerror="this.remove()"></a>
      <a class="chip" style="--c:#EA4335" data-name="Gmail" href="https://mail.google.com/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/gmail/fff" alt="Gmail" onerror="this.remove()"></a>
      <a class="chip" style="--c:#4285F4" data-name="Calendar" href="https://calendar.google.com/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/googlecalendar/fff" alt="Google Calendar" onerror="this.remove()"></a>

<script>
  var VIDEO_ID = "rFZHOHl-L8A";
  var SEARCH_URL = "https://www.google.com/search?q=";
  var BASE_W = 1920;
  var BASE_H = 1080;
  var OVERSCAN = 1.04;

  var player = null;
  var muted = true;
  var overlay = document.getElementById("overlay");

  /* Su telefono lo sfondo è la GIF: niente player YouTube */
  var isPhone = window.matchMedia("(max-width: 900px)").matches;

  /* ================= YouTube player ================= */
  if (!isPhone) {
    var tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      videoId: VIDEO_ID,
      host: "https://www.youtube-nocookie.com",
      width: BASE_W,
      height: BASE_H,
      playerVars: {
        autoplay: 1, loop: 1, playlist: VIDEO_ID, controls: 0, disablekb: 1,
        modestbranding: 1, playsinline: 1, fs: 0, iv_load_policy: 3,
        cc_load_policy: 0, rel: 0
      },
      events: {
        onReady: function (e) {
          e.target.mute();
          e.target.playVideo();
          fitPlayer();
          overlay.classList.remove("show");
        },
        onError: function () { overlay.classList.add("show"); },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) overlay.classList.remove("show");
        }
      }
    });
  }

  function fitPlayer() {
    var el = document.getElementById("player");
    if (!el) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var k = Math.max(vw / BASE_W, vh / BASE_H) * OVERSCAN;
    el.style.width = BASE_W + "px";
    el.style.height = BASE_H + "px";
    el.style.left = Math.round((vw - BASE_W) / 2) + "px";
    el.style.top = Math.round((vh - BASE_H) / 2) + "px";
    el.style.transform = "scale(" + k + ")";
  }

  fitPlayer();
  window.addEventListener("resize", fitPlayer);
  window.addEventListener("orientationchange", function () { setTimeout(fitPlayer, 300); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fitPlayer);

  overlay.addEventListener("click", function () {
    if (player && player.playVideo) { player.mute(); player.playVideo(); }
    overlay.classList.remove("show");
  });

  /* ================= Audio on background click ================= */
  var ICON_MUTED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M22 9l-6 6M16 9l6 6"></path></svg>';
  var ICON_SOUND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M16.5 8.5a5 5 0 010 7"></path><path d="M19.5 5.5a9 9 0 010 13"></path></svg>';

  var toast = document.getElementById("toast");
  var toastTimer = null;

  function showToast(text, icon) {
    document.getElementById("toastText").textContent = text;
    document.getElementById("toastIcon").innerHTML = icon;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1600);
  }

  function toggleAudio() {
    if (!player) return;
    muted = !muted;
    if (player && player.mute && player.unMute) {
      muted ? player.mute() : player.unMute();
    }
    showToast(muted ? "Audio disattivato" : "Audio attivo", muted ? ICON_MUTED : ICON_SOUND);
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest("input, textarea, button, select, a, .side, .left, #overlay")) return;
    toggleAudio();
  });

  /* ================= Orologio ================= */
  var DOW = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
  var MONTHS = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio",
                "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];

  function tick() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    document.getElementById("dayName").textContent = DOW[d.getDay()];
    document.getElementById("time").textContent =
      (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  }
  tick();
  setInterval(tick, 1000);

  /* ================= Weather (Open-Meteo) ================= */
  var WMO = {
    0:  ["Sereno", "sun"],
    1:  ["Prevalentemente sereno", "partly"],
    2:  ["Parzialmente nuvoloso", "partly"],
    3:  ["Coperto", "cloud"],
    45: ["Nebbia", "fog"],
    48: ["Nebbia con brina", "fog"],
    51: ["Pioviggine leggera", "rain"],
    53: ["Pioviggine", "rain"],
    55: ["Pioviggine forte", "rain"],
    56: ["Pioviggine gelata", "rain"],
    57: ["Pioviggine gelata forte", "rain"],
    61: ["Pioggia leggera", "rain"],
    63: ["Pioggia", "rain"],
    65: ["Pioggia forte", "rain"],
    66: ["Pioggia gelata", "rain"],
    67: ["Pioggia gelata forte", "rain"],
    71: ["Neve leggera", "snow"],
    73: ["Neve", "snow"],
    75: ["Neve abbondante", "snow"],
    77: ["Granelli di neve", "snow"],
    80: ["Rovesci leggeri", "rain"],
    81: ["Rovesci", "rain"],
    82: ["Rovesci violenti", "rain"],
    85: ["Rovesci di neve", "snow"],
    86: ["Rovesci di neve forti", "snow"],
    95: ["Temporale", "storm"],
    96: ["Temporale con grandine", "storm"],
    99: ["Temporale con grandine forte", "storm"]
  };

  var ICONS = {
    sun:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>',
    partly: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"></circle><path d="M8 1.8v1.6M1.8 8h1.6M3.6 3.6l1.1 1.1M12.4 3.6l-1.1 1.1"></path><path d="M9.5 19.5h8a3.6 3.6 0 00.3-7.2A5 5 0 007.2 13 3.3 3.3 0 009.5 19.5z"></path></svg>',
    cloud:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 19h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 11.4 4 4 0 007.5 19z"></path></svg>',
    fog:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7.5 14h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 6.4 4 4 0 007.5 14z"></path><path d="M4 17h16M6 20.5h12"></path></svg>',
    rain:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 7.4 4 4 0 007.5 15z"></path><path d="M8.5 18l-1 3M13 18l-1 3M17.5 18l-1 3"></path></svg>',
    snow:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 7.4 4 4 0 007.5 15z"></path><path d="M8 18v3M6.6 18.8l2.8 1.4M9.4 18.8l-2.8 1.4M16 18v3M14.6 18.8l2.8 1.4M17.4 18.8l-2.8 1.4"></path></svg>',
    storm:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15h9.2a4.3 4.3 0 00.4-8.6A6 6 0 006.3 7.4 4 4 0 007.5 15z"></path><path d="M13 16l-3 4h4l-2 3.5"></path></svg>'
  };

  function wxInfo(code) {
    var e = WMO[code] || ["Sconosciuto", "cloud"];
    return { desc: e[0], key: e[1], icon: ICONS[e[1]] || ICONS.cloud };
  }

  /* Sfondo GIF della card meteo, in base all'icona */
  function setWxBg(id, key) {
    var el = document.getElementById(id);
    if (el) el.style.backgroundImage = "url('GIFs/" + key + ".gif')";
  }

  /* Città predefinita: Camaiore (Lucca) */
  var DEFAULT_CITY = { name: "Camaiore (Lucca)", lat: 43.94265, lon: 10.29754 };

  function geocode(name) {
    return fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(name) +
                 "&count=1&language=it&format=json")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var r = (j.results || [])[0];
        if (!r) throw new Error("Città non trovata");
        return { name: r.name, lat: r.latitude, lon: r.longitude };
      });
  }

  function locate() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem("sp_city2")); } catch (e) {}
    return Promise.resolve(saved || DEFAULT_CITY);
  }

  function loadWeather() {
    locate().then(function (city) {
      if (!city) return;
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + city.lat + "&longitude=" + city.lon +
        "&current=temperature_2m,apparent_temperature,weather_code" +
        "&hourly=temperature_2m,weather_code,precipitation_probability" +
        "&daily=temperature_2m_max,temperature_2m_min,weather_code" +
        "&timezone=auto&forecast_days=3";
      return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
        renderWeather(city, j);
      });
    }).catch(function () {
      document.getElementById("wxDescNow").textContent = "Meteo non disponibile";
    });
  }

  function renderWeather(city, j) {
    document.getElementById("wxCity").textContent = city.name;
    try { localStorage.setItem("sp_city2", JSON.stringify(city)); } catch (e) {}

    var cur = j.current || {};
    var now = wxInfo(cur.weather_code);
    document.getElementById("wxIconNow").innerHTML = now.icon;
    document.getElementById("wxDescNow").textContent = now.desc;
    document.getElementById("wxTempNow").textContent = Math.round(cur.temperature_2m) + "°";
    setWxBg("wxBgNow", now.key);
    var d0 = j.daily || {};
    var sub = "";
    if (d0.temperature_2m_max && d0.temperature_2m_min) {
      sub += "min " + Math.round(d0.temperature_2m_min[0]) + "° · max " + Math.round(d0.temperature_2m_max[0]) + "°";
    }
    if (cur.apparent_temperature != null) sub += (sub ? " · " : "") + "percepita " + Math.round(cur.apparent_temperature) + "°";
    document.getElementById("wxSubNow").textContent = sub;

    /* In 12 hours (local time of the place) */
    var h = j.hourly || {};
    if (h.time && h.time.length) {
      var ref = cur.time || h.time[0];
      var target = new Date(ref + "T00:00").getTime() + 12 * 3600 * 1000;
      var idx = 0, best = Infinity;
      for (var i = 0; i < h.time.length; i++) {
        var t = new Date(h.time[i] + "T00:00").getTime();
        var diff = Math.abs(t - target);
        if (diff < best) { best = diff; idx = i; }
      }
      var f = wxInfo(h.weather_code[idx]);
      document.getElementById("wxIcon12").innerHTML = f.icon;
      document.getElementById("wxDesc12").textContent = f.desc;
      document.getElementById("wxTemp12").textContent = Math.round(h.temperature_2m[idx]) + "°";
      setWxBg("wxBg12", f.key);
      var s12 = "ore " + h.time[idx].slice(11, 16);
      if (h.precipitation_probability) s12 += " · " + h.precipitation_probability[idx] + "% pioggia";
      document.getElementById("wxSub12").textContent = s12;
    }
  }

  document.getElementById("wxCity").addEventListener("click", function () {
    var name = prompt("Città per il meteo:", this.textContent.trim());
    if (!name) return;
    geocode(name).then(function (c) {
      localStorage.setItem("sp_city2", JSON.stringify(c));
      loadWeather();
    }).catch(function (err) { alert(err.message || "Città non trovata"); });
  });

  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);

  /* ================= Calendar ================= */
  function renderCalendar() {
    var d = new Date();
    var y = d.getFullYear(), mo = d.getMonth();
    document.getElementById("calTitle").textContent = MONTHS[mo] + " " + y;
    document.getElementById("calToday").textContent = d.getDate() + "-" + (mo + 1);

    var first = new Date(y, mo, 1);
    var days = new Date(y, mo + 1, 0).getDate();
    var offset = (first.getDay() + 6) % 7; /* la settimana parte dal lunedì */

    var heads = [["L", "Lun"], ["M", "Mar"], ["M", "Mer"], ["G", "Gio"], ["V", "Ven"], ["S", "Sab"], ["D", "Dom"]];
    var html = heads.map(function (x) {
      return '<div class="dow" title="' + x[1] + '">' + x[0] + "</div>";
    }).join("");

    for (var i = 0; i < offset; i++) html += '<div class="day empty"></div>';
    for (var k = 1; k <= days; k++) {
      html += '<div class="day' + (k === d.getDate() ? " today" : "") + '">' + k + "</div>";
    }
    document.getElementById("calGrid").innerHTML = html;
  }
  renderCalendar();

  /* ================= Categorie collassabili (telefono) ================= */
  document.querySelectorAll(".cat-head").forEach(function (head) {
    head.addEventListener("click", function () {
      var card = head.parentElement;
      var opened = card.classList.toggle("open");
      if (opened) {
        document.querySelectorAll(".left .card.open").forEach(function (c) {
          if (c !== card) c.classList.remove("open");
        });
      }
    });
  });

  /* Social aperta di default su telefono */
  if (isPhone) {
    var socialCard = document.querySelector('.left .card[data-cat="social"]');
    if (socialCard) socialCard.classList.add("open");
  }

  /* ================= Località meteo: su telefono fuori dalla card ================= */
  var sideEl = document.querySelector(".side");
  var wxPlaceEl = document.querySelector(".wx-place");
  var wxNowEl = document.getElementById("wxCardNow");
  var phoneMq = window.matchMedia("(max-width: 900px)");

  function placeLocation() {
    if (!sideEl || !wxPlaceEl || !wxNowEl) return;
    if (phoneMq.matches) {
      if (wxPlaceEl.parentElement !== sideEl) sideEl.insertBefore(wxPlaceEl, sideEl.firstChild);
      wxPlaceEl.classList.add("phone-place");
    } else {
      if (wxPlaceEl.parentElement !== wxNowEl) wxNowEl.insertBefore(wxPlaceEl, wxNowEl.firstChild);
      wxPlaceEl.classList.remove("phone-place");
    }
  }

  placeLocation();
  if (phoneMq.addEventListener) phoneMq.addEventListener("change", placeLocation);

  /* ================= Notepad ================= */
  var notes = document.getElementById("notes");
  var noteState = document.getElementById("noteState");
  var noteTimer = null;

  notes.value = localStorage.getItem("sp_notes") || "";

  notes.addEventListener("input", function () {
    noteState.textContent = "Salvataggio...";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () {
      localStorage.setItem("sp_notes", notes.value);
      noteState.textContent = "Salvata";
      setTimeout(function () { noteState.textContent = ""; }, 1200);
    }, 400);
  });
</script>
</body>
</html>
