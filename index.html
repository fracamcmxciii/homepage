<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WELCOME BACK FRACA!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0d0d0d;
            --border-color: #262626;
            --border-hover: #ffffff;
            --text-color: #ffffff;
            --text-dim: #737373;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Blocco zoom e scorrimento orizzontale */
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            touch-action: pan-y;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem 1rem;
            min-height: 100vh;
            position: relative;
        }

        /* Grid Monocromatico Cyberpunk */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
            animation: gridScan 12s linear infinite;
        }

        @keyframes gridScan {
            0% { background-position: 0 0; }
            100% { background-position: 0 30px; }
        }

        /* Scanline Overlay CRT */
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 99;
            opacity: 0.6;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 2.5rem auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Top Bar: Titolo a Sinistra + Meteo a Destra */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 0.5rem;
        }

        /* Titolo Glitch Cyberpunk */
        header h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.5rem;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: glitch 4s infinite;
            text-align: left;
            line-height: 1.1;
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
            92% { transform: translate(-2px, 1px); text-shadow: -2px 0 #ffffff, 2px 0 #555555; }
            94% { transform: translate(2px, -1px); text-shadow: 2px 0 #ffffff, -2px 0 #555555; }
            96% { transform: translate(-1px, -1px); text-shadow: 0 0 15px #ffffff; }
        }

        /* Widget Meteo Domani */
        .weather-widget {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.8rem;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            font-family: 'Share Tech Mono', monospace;
            flex-shrink: 0;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .weather-label {
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .weather-temp {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .weather-icon-container {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weather-icon-container svg {
            width: 100%;
            height: 100%;
            fill: #ffffff;
            stroke: #ffffff;
        }

        /* Search Bar Cyberpunk */
        .search-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-form {
            display: flex;
            gap: 0.5rem;
            background-color: var(--card-bg);
            padding: 0.4rem;
            border: 1px solid var(--border-color);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: all 0.3s ease;
        }

        .search-form:focus-within {
            border-color: var(--border-hover);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 0.6rem 1rem;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            letter-spacing: 1px;
            width: 100%;
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        .search-button {
            background: #ffffff;
            color: #000000;
            border: none;
            outline: none;
            padding: 0.6rem 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: all 0.2s ease;
        }

        .search-button:hover {
            background: #cccccc;
            box-shadow: 0 0 15px #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: relative;
            z-index: 1;
        }

        .category {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .category-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            color: #ffffff;
            text-transform: uppercase;
            border-left: 4px solid #ffffff;
            padding-left: 0.6rem;
            display: inline-block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 1rem;
        }

        .card {
            background-color: #000000;
            text-decoration: none;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            border: 1px solid var(--border-color);
            position: relative;
            aspect-ratio: 1 / 1;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .card:hover {
            background-color: #1a1a1a;
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .card img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            filter: grayscale(100%) brightness(200%);
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .card:hover img {
            filter: grayscale(0%) brightness(120%);
            transform: scale(1.1);
        }

        /* Tooltip Cyberpunk */
        .card::after {
            content: attr(data-title);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            padding: 2px 6px;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
        }

        .card:hover::after {
            opacity: 1;
        }

        /* OTTIMIZZAZIONE SMARTPHONE / MOBILE */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.4rem;
                letter-spacing: 1px;
            }

            .weather-widget {
                padding: 0.3rem 0.5rem;
                gap: 0.4rem;
            }

            .weather-label {
                font-size: 0.5rem;
            }

            .weather-temp {
                font-size: 0.85rem;
            }

            .weather-icon-container {
                width: 24px;
                height: 24px;
            }

            .search-input {
                padding: 0.4rem 0.6rem;
                font-size: 0.85rem;
            }

            .search-button {
                padding: 0.4rem 0.7rem;
                font-size: 0.75rem;
            }

            .category {
                padding: 0.8rem;
            }

            .category-title {
                font-size: 1.1rem;
                margin-bottom: 0.6rem;
            }

            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 0.4rem;
            }

            .card {
                padding: 0.4rem;
            }

            .card img {
                width: 24px;
                height: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- CRT Scanline Effect -->
    <div class="scanline"></div>

    <header>
        <div class="top-bar">
            <h1>WELCOME BACK FRACA!</h1>
            
            <!-- Widget Meteo Domani -->
            <div class="weather-widget" id="weather-widget">
                <div class="weather-info">
                    <span class="weather-label">TOMORROW</span>
                    <span class="weather-temp" id="weather-temp">--°C</span>
                </div>
                <div class="weather-icon-container" id="weather-icon-box">

        <!-- Barra di Ricerca DuckDuckGo -->
        <div class="search-container">
            <form class="search-form" action="https://duckduckgo.com/" method="get" target="_blank">

                <button type="submit" class="search-button">SEARCH</button>

    <main class="container">
        
        <!-- SOCIAL -->
        <section class="category">
            <h2 class="category-title">Social</h2>
            <div class="grid">
                <a href="https://www.youtube.com" target="_blank" class="card" data-title="YouTube">

                </a>
                <a href="https://www.reddit.com" target="_blank" class="card" data-title="Reddit">
                    <img src="https://cdn.simpleicons.org/reddit/ffffff" alt="Reddit" onerror="this.src='https://icons.duckduckgo.com/ip3/reddit.com.ico'">
                </a>
                <a href="https://www.pinterest.com" target="_blank" class="card" data-title="Pinterest">
                    <img src="https://cdn.simpleicons.org/pinterest/ffffff" alt="Pinterest" onerror="this.src='https://icons.duckduckgo.com/ip3/pinterest.com.ico'">
                </a>
                <a href="https://www.instagram.com" target="_blank" class="card" data-title="Instagram">
                    <img src="https://cdn.simpleicons.org/instagram/ffffff" alt="Instagram" onerror="this.src='https://icons.duckduckgo.com/ip3/instagram.com.ico'">

                <a href="https://www.facebook.com" target="_blank" class="card" data-title="Facebook">
                    <img src="https://cdn.simpleicons.org/facebook/ffffff" alt="Facebook" onerror="this.src='https://icons.duckduckgo.com/ip3/facebook.com.ico'">

                <a href="https://web.telegram.org" target="_blank" class="card" data-title="Telegram">
                    <img src="https://cdn.simpleicons.org/telegram/ffffff" alt="Telegram" onerror="this.src='https://icons.duckduckgo.com/ip3/telegram.org.ico'">
                </a>

        </section>

        <!-- MEDIA -->
        <section class="category">
            <h2 class="category-title">Media</h2>
            <div class="grid">
                <a href="https://store.steampowered.com" target="_blank" class="card" data-title="Steam">
                    <img src="https://cdn.simpleicons.org/steam/ffffff" alt="Steam" onerror="this.src='https://icons.duckduckgo.com/ip3/store.steampowered.com.ico'">

                <a href="https://store.epicgames.com" target="_blank" class="card" data-title="Epic Games">
                    <img src="https://cdn.simpleicons.org/epicgames/ffffff" alt="Epic Games" onerror="this.src='https://icons.duckduckgo.com/ip3/epicgames.com.ico'">

    <!-- Script Meteo con SVG Incorporati (Garantisce visualizzazione istantanea 100%) -->
    <script>
        const svgIcons = {
            sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
            partlyCloudy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M17.65 6.35l1.41-1.41"/><path d="M16 16a4 4 0 0 0-3.97-4 5 5 0 0 0-9.2 2.5A3.5 3.5 0 0 0 4 21h12a4 4 0 0 0 0-8z"/></svg>`,
            cloudy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>`,
            rain: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="16" y1="13" x2="16" y2="21"/><line x1="8" y1="13" x2="8" y2="21"/><line x1="12" y1="15" x2="12" y2="23"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>`,
            snow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="12" y1="18" x2="12.01" y2="18"/><line x1="16" y1="16" x2="16.01" y2="16"/></svg>`,
            thunder: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><polyline points="13 11 9 17 15 17 11 23"/></svg>`
        };

        function setWeatherIconSVG(code) {
            const container = document.getElementById('weather-icon-box');
            if (code === 0) container.innerHTML = svgIcons.sun;
            else if ([1, 2].includes(code)) container.innerHTML = svgIcons.partlyCloudy;
            else if (code === 3) container.innerHTML = svgIcons.cloudy;
            else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) container.innerHTML = svgIcons.rain;
            else if ([71, 73, 75, 77, 85, 86].includes(code)) container.innerHTML = svgIcons.snow;
            else if ([95, 96, 99].includes(code)) container.innerHTML = svgIcons.thunder;
            else container.innerHTML = svgIcons.cloudy;
        }

        async function fetchTomorrowWeather(lat, lon) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max&timezone=auto`);
                const data = await response.json();
                
                const weatherCode = data.daily.weathercode[1]; // Indice 1 = Domani
                const maxTemp = Math.round(data.daily.temperature_2m_max[1]);

                document.getElementById('weather-temp').innerText = `${maxTemp}°C`;
                setWeatherIconSVG(weatherCode);
            } catch (err) {
                document.getElementById('weather-temp').innerText = "--°C";
                setWeatherIconSVG(0)
