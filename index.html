<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
  }

  /* ---------- Background ---------- */
  #bg {
    position: fixed;
    inset: 0;
    background: #0b0b0f center/cover no-repeat;
    z-index: 0;
  }

  #player {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    pointer-events: none;
    z-index: 1;
  }

  .veil {
    position: fixed;
    inset: 0;
    z-index: 2;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,.15) 0%, rgba(0,0,0,.45) 70%, rgba(0,0,0,.6) 100%);
    backdrop-filter: blur(2px);
  }

  /* ---------- Content ---------- */
  .stage {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 24px;
  }

  .clock {
    font-size: clamp(56px, 9vw, 116px);
    font-weight: 200;
    letter-spacing: -2px;
    text-shadow: 0 4px 30px rgba(0,0,0,.55);
    font-variant-numeric: tabular-nums;
  }

  .date {
    font-size: clamp(14px, 1.6vw, 19px);
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: .85;
    text-shadow: 0 2px 14px rgba(0,0,0,.6);
  }

  /* ---------- Search ---------- */
  .search-wrap {
    position: relative;
    width: min(660px, 92vw);
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 6px 18px;
    border-radius: 999px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
    transition: background .2s, border-color .2s, box-shadow .2s;
  }

  .search-box:focus-within {
    background: rgba(255,255,255,.16);
    border-color: rgba(255,255,255,.5);
    box-shadow: 0 14px 50px rgba(0,0,0,.45);
  }

  .search-box svg {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    opacity: .85;
  }

  #q {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #fff;
    font-size: 17px;
    padding: 12px 0;
  }

  #q::placeholder { color: rgba(255,255,255,.6); }

  #engine {
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px;
    background: rgba(255,255,255,.10);
    color: #fff;
    font-size: 13px;
    padding: 8px 30px 8px 14px;
    cursor: pointer;
    outline: 0;
  }

  #engine option { background: #1a1a1f; color: #fff; }

  #engine:focus-visible { border-color: rgba(255,255,255,.6); }

  .engine-caret {
    position: absolute;
    right: 116px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    pointer-events: none;
    border-right: 1.5px solid rgba(255,255,255,.7);
    border-bottom: 1.5px solid rgba(255,255,255,.7);
    rotate: 45deg;
    margin-top: -3px;
  }

  .hint {
    font-size: 12.5px;
    letter-spacing: .4px;
    opacity: .6;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }

  .hint kbd {
    font-family: inherit;
    font-size: 11px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 5px;
    padding: 1px 5px;
    margin: 0 2px;
  }

  /* ---------- Mute toggle ---------- */
  #sound {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 4;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(12px);
    color: #fff;
    cursor: pointer;
    opacity: .65;
    transition: opacity .2s, transform .2s;
  }

  #sound:hover { opacity: 1; transform: scale(1.06); }
  #sound svg { width: 20px; height: 20px; }

  @media (max-width: 520px) {
    #engine { display: none; }
    .engine-caret { display: none; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="player"></div>
<div class="veil"></div>

<div class="stage">
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>

  <form class="search-wrap" id="form" autocomplete="off">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="q" type="text" placeholder="Cerca sul web..." autofocus spellcheck="false">
      <select id="engine" title="Motore di ricerca">
        <option value="google">Google</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="youtube">YouTube</option>
        <option value="bing">Bing</option>
        <option value="startpage">Startpage</option>
        <option value="brave">Brave</option>
      </select>
      <span class="engine-caret"></span>
    </div>
  </form>

  <div class="hint"><kbd>/</kbd> per cercare &nbsp;·&nbsp; <kbd>Esc</kbd> per uscire</div>
</div>

<button id="sound" title="Attiva/disattiva audio">
  <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
    <path d="M16.5 8.5a5 5 0 010 7"></path>
    <path d="M19.5 5.5a9 9 0 010 13"></path>
  </svg>
</button>

<script>
  var VIDEO_ID = "rFZHOHl-L8A";

  var ENGINES = {
    google:     "https://www.google.com/search?q=",
    duckduckgo: "https://duckduckgo.com/?q=",
    youtube:    "https://www.youtube.com/results?search_query=",
    bing:       "https://www.bing.com/search?q=",
    startpage:  "https://www.startpage.com/sp/search?query=",
    brave:      "https://search.brave.com/search?q="
  };

  /* ---------- Background fallback (thumbnail) ---------- */
  document.getElementById("bg").style.backgroundImage =
    "url(https://i.ytimg.com/vi/" + VIDEO_ID + "/maxresdefault.jpg)";

  /* ---------- YouTube player ---------- */
  var player = null;
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      videoId: VIDEO_ID,
      host: "https://www.youtube-nocookie.com",
      playerVars: {
        autoplay: 1,
        loop: 1,
        playlist: VIDEO_ID,
        controls: 0,
        disablekb: 1,
        modestbranding: 1,
        playsinline: 1,
        fs: 0,
        iv_load_policy: 3,
        cc_load_policy: 0,
        rel: 0
      },
      events: {
        onReady: function (e) {
          e.target.mute();
          e.target.playVideo();
        }
      }
    });
  }

  /* ---------- Clock ---------- */
  function tick() {
    var d = new Date();
    var h = d.getHours();
    var m = d.getMinutes();
    document.getElementById("clock").textContent =
      (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
    document.getElementById("date").textContent =
      d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- Search ---------- */
  var form = document.getElementById("form");
  var q = document.getElementById("q");
  var engineSel = document.getElementById("engine");

  var saved = localStorage.getItem("sp_engine");
  if (saved && ENGINES[saved]) engineSel.value = saved;
  engineSel.addEventListener("change", function () {
    localStorage.setItem("sp_engine", engineSel.value);
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var term = q.value.trim();
    if (!term) return;
    window.location.href = ENGINES[engineSel.value] + encodeURIComponent(term);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== q && document.activeElement !== engineSel) {
      e.preventDefault();
      q.focus();
      q.select();
    } else if (e.key === "Escape") {
      q.blur();
    }
  });

  /* ---------- Sound ---------- */
  var soundBtn = document.getElementById("sound");
  var icon = document.getElementById("soundIcon");
  var muted = true;

  soundBtn.addEventListener("click", function () {
    muted = !muted;
    if (player && player.mute && player.unMute) {
      muted ? player.mute() : player.unMute();
    }
    icon.innerHTML = muted
      ? '<path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M22 9l-6 6M16 9l6 6"></path>'
      : '<path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M16.5 8.5a5 5 0 010 7"></path><path d="M19.5 5.5a9 9 0 010 13"></path>';
  });
</script>
</body>
</html>
